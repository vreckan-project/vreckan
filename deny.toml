# cargo-deny policy for the vreckan dependency tree (ANT-69).
#
# Run `cargo deny check` to run all four checks (advisories, licenses, bans,
# sources). This is the Rust-centric dependency-hygiene layer that neither
# the Trivy image scan nor Grype handle well for Rust: SPDX license policy,
# duplicate-crate dedup, a source allowlist, and advisory (vulnerability)
# matching. It runs as a nightly gate in the workflow repo's scan-rust.yml.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

# [graph]
# Uncomment to also cover dependencies that are only pulled in via non-default
# feature flags. The default (all-features = false) matches how the release
# binary is built (default features).
# all-features = true

[advisories]
# Match Cargo.lock against the RustSec advisory DB (cloned from
# github.com/rustsec/advisory-db; the nightly runner has outbound network).
# By default a finding in any category (vulnerability / unsound /
# unmaintained / yanked) is an ERROR, so any NEW advisory fails the nightly.
# The known advisories are ignored (with reasons) because they are accepted
# risk in this tree; drop an entry once its crate is fixed.
ignore = [
  # rsa — "Marvin Attack": a non-constant-time RSA leaks the private key
  # through timing observable over the network. No safe upgrade exists yet
  # (crypto-bigint migration pending; tracked in RustCrypto/RSA#626). We use
  # rsa for offline RSA-PSS/OAEP key ops, not an attacker-observable channel.
  # The ignore is ID-based, so it covers every rsa instance in the tree that
  # carries this advisory: the 0.9.10 instance (jsonwebtoken 10/11) and the
  # 0.10.0-rc.20 instance — the held RustCrypto pin, the tracked one since
  # ANT-801 (the rc.19 instance it replaced is out of the tree).
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin-attack timing sidechannel; no safe upgrade yet, offline key usage" },
  # crypto-bigint 0.5.5 — constant-time timing variability (RustCrypto
  # crypto-bigint#1365), fixed only in >=0.7.6; no 0.5.x patch exists. The
  # 0.7.5 instance in this tree was bumped to 0.7.6 (ANT-545); the 0.5.5
  # instance is pinned by elliptic-curve 0.13.8 via p256 0.13 / p384 0.13,
  # which both jsonwebtoken majors (10 via jwks 0.5, 11 direct) require —
  # neither has released an elliptic-curve 0.14-based line yet (ANT-545
  # follow-up tracks the ecosystem bump).
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability; 0.7.x instance bumped to 0.7.6, 0.5.x line has no patch yet" },
  # libsqlite3-sys 0.37.0 — bundles SQLite 3.51.3, affected by
  # CVE-2026-119375 (RUSTSEC-2026-0459, medium CVSS 6.8, published
  # 2026-10-30): a WAL file with an undersized page size lets a LOCAL
  # attacker read uninitialized page-cache memory via substr() and similar,
  # disclosing other table rows and internal pointers (AV:L/AC:L/PR:N/UI:P,
  # high confidentiality impact). The fix (SQLite >=3.54.0, i.e.
  # libsqlite3-sys >=0.39.0) is UNREACHABLE in this graph: sqlx 0.9.0
  # (latest published) caps sqlx-sqlite's libsqlite3-sys at
  # `>=0.30.1, <0.38.0`. Practical exposure is limited — the vuln requires
  # an attacker to control the on-disk DB/WAL files, which vreckan ships at
  # 0600 owner-only (ANT-345), and the SQLite backend is the dev/single-user
  # default (PostgreSQL is the documented production backend). TEMPORARY
  # allowance: drop this entry AND the `--ignore RUSTSEC-2026-0459` flag in
  # build-test-rust.yml the moment a sqlx/SeaORM release allows
  # libsqlite3-sys >=0.39.0 and we bump to it.
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37.0 bundles SQLite 3.51.3 (CVE-2026-119375, local info-disclosure via a crafted WAL file); fix unreachable until sqlx-sqlite allows libsqlite3-sys >=0.39.0; DB/WAL shipped 0600 owner-only and postgres is the prod backend" },
  # rustls-pemfile 2.2 — archived/unmaintained. Thin wrapper over
  # rustls-pki-types (its parsing code moved there); accepted until we drop it.
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile archived; thin wrapper over rustls-pki-types" },
  # unsafe-libyaml 0.2.11 — archived/unmaintained. Transitive dep of
  # serde_yaml (itself marked +deprecated); tracked for removal, low risk.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml archived; transitive dep of serde_yaml (+deprecated)" },
  # pin-utils 0.1.1 — archived/unmaintained (rust-lang team archived the repo
  # 2026-10-01; RUSTSEC-2026-0441 informational, landed in the advisory DB
  # 2026-11-05). Macros-only pinning helper; the only instance in this tree is
  # transitive via aws-smithy-http (aws-sdk stack) <- acmex, which has no
  # in-tree replacement. Accepted until the aws-sdk subtree changes.
  { id = "RUSTSEC-2026-0441", reason = "pin-utils archived 2026-10-01; macros-only, transitive via aws-sdk (aws-smithy-http); no in-tree replacement" },
  # The crates whose advisories used to require ignores in the acmex subtree
  # (h2 0.3, hickory 0.25, rustls 0.21, rustls-webpki 0.101 — RUSTSEC-2026-0258/
  # 0118/0119/0346/0349/0098/0099/0104) are gone: pinning acmex to the upstream
  # git rev (ANT-138, `[patch.crates-io]` in Cargo.toml) re-resolved them to the
  # advisory-fixed majors (h2 0.4, hickory 0.26, rustls 0.23, webpki 0.103).
  # Re-add any of them if a future acmex pin regresses the tree.
]

[licenses]
# SPDX policy: allow the common permissive licenses plus our own project
# license (MPL-2.0) and the permissive certificate-data license
# (CDLA-Permissive-2.0). An OR-expression passes if at least one of its
# options is allowed, so the only copyleft in the tree (LGPL in r-efi, which
# is OR'd with MIT/Apache) is satisfied without allowing copyleft. Any other
# license expression is an ERROR. A 0.94 confidence threshold (stricter than
# the 0.8 default) flags fuzzy license guesses instead of accepting them.
confidence-threshold = 0.94
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  # (The OpenSSL license allow dropped in ANT-811: its only source was
  # aws-lc-fips-sys — "ISC AND (Apache-2.0 OR ISC) AND OpenSSL" — pulled in
  # by acmex's aws-lc-rs `fips` feature, now removed. The plain `openssl`
  # crate that remains via native-tls is declared Apache-2.0/MIT. Re-add the
  # entry if a future dep reintroduces the OpenSSL clause.)
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# Surface duplicate crate versions as WARNINGS (25 crates in the current tree
# have more than one version — see the nightly log for the list). Tighten to
# "deny" once the major versions converge. Use `deny = [...]` for explicit
# crate bans (e.g. to forbid a crate outright regardless of version).
multiple-versions = "warn"
deny = []

[sources]
# Source allowlist: the canonical crates.io registry plus the acmex fork
# (pinned via `[patch.crates-io]` in Cargo.toml for the account-key crypto
# fix + contact-field default, ANT-138 — see that comment for the reason
# and the revert condition). Unexpected sources are WARNINGS (not errors)
# for now.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/vreckan-project/acmex",
  "https://github.com/houseme/acmex",
]
unknown-registry = "warn"
unknown-git = "warn"
