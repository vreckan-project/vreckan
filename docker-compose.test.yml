# TEST-ONLY compose file. Mirrors docker-compose.yml but uses non-conflicting
# container names, a separate network/volume, and publishes the API on host
# port 8444 (instead of 8443) so it can run alongside the dev containers.
#
#     docker compose -f docker-compose.test.yml up -d --build
#     docker compose -f docker-compose.test.yml down -v
#
# This file is for validation only — use docker-compose.yml for real deploys.

name: vreckan-test

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vreckan-api:local
    container_name: vreckan-test-api
    restart: "no"
    # The API serves TLS directly on 8443 inside the container, published as
    # 8444 on the host so it does not clash with the dev container.
    ports:
      - "8444:8443"
    environment:
      - WORK=/data
      - VRECKAN_LOG_LEVEL=INFO
      - VRECKAN_API_PORT=8443
      - VRECKAN_SESSION_PORT=8443
    # GPU passthrough (Intel) — mirrors the dev/prod containers.
    privileged: true
    ipc: host
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "990"   # render
      - "44"    # video
    volumes:
      - vreckan-test-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri
    networks:
      - vreckan-test-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl,sys; ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/', timeout=3, context=ctx).status < 500 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  vreckan-test-data:

networks:
  vreckan-test-net:
    name: vreckan-test-net
