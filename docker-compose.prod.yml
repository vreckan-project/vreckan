# Vreckan — production docker-compose deployment.
#
# Brings up the API server, which serves TLS directly on 8443 (there is no
# separate reverse-proxy container). The API talks to the Docker daemon (via
# the mounted socket) to spawn and manage the actual app containers.
#
# Quick start:
#
#     cp .env.example .env        # then edit .env as needed
#     docker compose up -d --build
#
# First run: the API generates a default admin account ("admin") whose
# bootstrap password is printed to the server logs. Change it after logging in.
#
# Persistence — the `vreckan-data` named volume holds all app state (keys,
# users, groups, installed apps, user storage, ...). For any non-local
# deployment, drop a real TLS certificate + key at /data/ssl/vreckan_dev.crt
# and vreckan_dev.key to override the auto-generated self-signed pair.
#
# Networking — the API auto-detects the Docker network it is attached to and
# places every app container it spawns on that same network, so it can reach
# them by IP. This file attaches the API to a dedicated `vreckan` network,
# which isolates the spawned app containers from the rest of the host.
#
#   This file targets a normal Linux production host, where the dedicated
#   `vreckan` network works fine (the WSL2 embedded-DNS issue that once broke
#   user-defined networks does not apply). The API container runs
#   `privileged` with the Intel GPU (/dev/dri) passed through and the host
#   render (990) + video (44) groups added, so spawned app containers can use
#   the GPU.
#
# Trust boundary — the API mounts /var/run/docker.sock so it can create and
# manage app containers on the host. Anything that can write to that socket
# effectively controls the Docker daemon (and thus the host); keep it secure.
#
# NOTE: this file uses a fixed container name (vreckan-api) and publishes host
# port 8443. If the *development* container (vreckan-http) is also running on
# this host, stop it first — or use docker-compose.test.yml, which runs an
# isolated instance on port 8444 alongside the dev containers.

name: vreckan

services:
  vreckan-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vreckan-api:local
    container_name: vreckan-api
    restart: unless-stopped
    # The API serves TLS directly on 8443 — the public entry point.
    ports:
      - "8443:8443"
    # GPU passthrough (Intel): exposes /dev/dri to the API container and joins
    # the host render (990) + video (44) groups. `privileged` is required for
    # the full device/capability set; it conflicts with the
    # no-new-privileges hardening, which is therefore intentionally omitted.
    privileged: true
    ipc: host
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "990"   # render
      - "44"    # video
    # Bound log growth on a long-running server (keep the 3 most recent 10 MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # --- core ---
      - WORK=/data
      - VRECKAN_LOG_LEVEL=${VRECKAN_LOG_LEVEL:-INFO}
      - VRECKAN_API_PORT=8443
      - VRECKAN_SESSION_PORT=8443
      # --- optional PostgreSQL (uncomment + enable the postgres service) ---
      # Defaults to a SQLite file in /data when left unset.
      # - VRECKAN_DATABASE_URL=postgresql+asyncpg://vreckan:vreckan@postgres:5432/vreckan
      # --- optional OIDC / SSO (uncomment + fill in to enable) ---
      # - VRECKAN_OIDC_ENABLED=${VRECKAN_OIDC_ENABLED:-false}
      # - VRECKAN_OIDC_ISSUER=${VRECKAN_OIDC_ISSUER:-}
      # - VRECKAN_OIDC_CLIENT_ID=${VRECKAN_OIDC_CLIENT_ID:-}
      # - VRECKAN_OIDC_CLIENT_SECRET=${VRECKAN_OIDC_CLIENT_SECRET:-}
      # - VRECKAN_OIDC_REDIRECT_URI=${VRECKAN_OIDC_REDIRECT_URI:-}
      # - VRECKAN_OIDC_ADMIN_GROUPS=${VRECKAN_OIDC_ADMIN_GROUPS:-}
      # - VRECKAN_OIDC_ALLOW_SIGNUP=${VRECKAN_OIDC_ALLOW_SIGNUP:-true}
    volumes:
      # Persistent application state.
      - vreckan-data:/data
      # Required so the API can spawn/manage app containers on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Intel GPU device nodes (see GPU passthrough note above).
      - /dev/dri:/dev/dri
    networks:
      - vreckan
    # Optional: pass the host's NVIDIA GPUs through to the spawned app
    # containers. Requires the NVIDIA Container Toolkit on the host.
    # Uncomment to enable.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      # Ready once the API answers over TLS on 8443.
      test: ["CMD", "python", "-c", "import urllib.request,ssl,sys; ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/', timeout=3, context=ctx).status < 500 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- Optional PostgreSQL configuration database -------------------------
  # Uncomment this service, the matching `volumes:` entry below, and the
  # VRECKAN_DATABASE_URL line in vreckan-api's environment to run the API
  # against PostgreSQL instead of the default SQLite file. Both containers
  # share the `vreckan` network, so the API reaches Postgres by service name.
  # postgres:
  #   image: postgres:16
  #   container_name: vreckan-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: vreckan
  #     POSTGRES_PASSWORD: vreckan   # change for a real deployment
  #     POSTGRES_DB: vreckan
  #   volumes:
  #     - vreckan-postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - vreckan
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U vreckan -d vreckan"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 10s

volumes:
  vreckan-data:
  # vreckan-postgres-data:   # uncomment with the postgres service above

networks:
  vreckan:
    name: vreckan
