# Auto-Merge Bump — the GitHub-side replacement for the old Gitea
# "Create Release" workflow.
#
# On every push to main (i.e. every merged PR or direct push), this workflow:
#   1. Reads the current VERSION from the repo.
#   2. Checks whether a tag v<VERSION> already exists.
#   3. If not, creates the tag, pushes it to GitHub, and mirrors it to the
#      Gitea mirror repo. The Gitea "Release" workflow then fires on the tag
#      push and builds + pushes the container image.
#
# This means a version only gets tagged when VERSION actually changes (a
# version-bump PR is merged). Ordinary PRs that don't touch VERSION are
# skipped (the tag already exists).
#
# Secrets needed (GitHub):
#   GITEA_URL    — e.g. https://repo.vreckanproject.com
#   GITEA_REPO   — e.g. vreckan/vreckan (the mirror repo)
#   GITEA_TOKEN  — a Gitea PAT with write access to the mirror repo
#   GH_TOKEN     — a GitHub token with write access (for pushing the tag)
name: Auto-Merge Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Current VERSION: ${VERSION} (tag ${TAG})"

      - name: Check if tag already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/${TAG}")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist — will create."
          fi

      - name: Create tag + push to GitHub
        if: steps.exists.outputs.exists == 'false'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "vreckan-release[bot]"
          git config user.email "release@vreckanproject.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          # Use GITHUB_TOKEN (not the PAT): on a push event it's granted write
          # access to the current repo, which is exactly what we need to push
          # the tag. The PAT 403s on the git push in CI (works for API reads).
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$TAG"
          echo "Pushed tag ${TAG} to GitHub"

      - name: Mirror tag to Gitea
        if: steps.exists.outputs.exists == 'false'
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          HOST="${GITEA_URL#https://}"
          AUTH_REMOTE="https://x-access-token:${GITEA_TOKEN}@${HOST}/$(echo "$GITEA_REPO" | sed 's#^/###').git"
          git remote remove gitea 2>/dev/null || true
          git remote add gitea "$AUTH_REMOTE"
          # Push the tag AND the commit it points to (as main) in one shot. The
          # Gitea release workflow clones `--branch <tag>`, which needs the
          # commit to already be in the mirror. The separate mirror-trigger
          # workflow pushes main in parallel, but pushing it here too removes
          # the race (both push the same commit, so it's a no-op for them).
          git push gitea "$TAG" "HEAD:refs/heads/main"
          echo "Mirrored tag ${TAG} + main to Gitea"
