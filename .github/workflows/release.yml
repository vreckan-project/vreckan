# Vreckan release — on a version tag (v1.2.3), build the image and push it to
# the container registry with both the version and `latest` tags.
#
# The registry is configured by two variables so it can be repointed without
# editing this file:
#
#   REGISTRY   — registry host, e.g. ghcr.io (default) or your custom registry
#   IMAGE_NAME — full image path, e.g. ghcr.io/<owner>/vreckan (default)
#
# Set them as repository Variables (Settings → Secrets and variables →
# Actions → Variables) or override the `env:` block below. Pushing to GHCR
# needs no extra secrets (GITHUB_TOKEN is granted package scope automatically);
# a custom registry needs a `REGISTRY_TOKEN` secret.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      # Required before a build that uses `cache-to: type=gha` — the default
      # "docker" driver can't export a GHA cache ("Cache export is not
      # supported for the docker driver"). setup-buildx switches to the
      # buildx driver, which supports it.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          # GITHUB_TOKEN works for GHCR; a custom registry uses REGISTRY_USER
          # + REGISTRY_TOKEN secrets instead.
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USER }}
          password: ${{ env.REGISTRY == 'ghcr.io' && github.token || secrets.REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
