# Vreckan nightly — builds the image and runs a Trivy vulnerability scan,
# uploading the report as an artifact. Runs daily at 06:00 UTC and can be
# triggered manually from the Actions tab.
name: Nightly scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: vreckan:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vreckan:scan
          format: table
          exit-code: "0"
          # Report CRITICAL and HIGH by default; the full report is uploaded
          # below regardless of severity.
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          output: trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30
