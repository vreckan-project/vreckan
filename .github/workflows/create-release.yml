# Create Release — the one-click release workflow.
#
# Triggered manually from the Actions tab (or via the API) with a bump kind:
#
#   major  — 0.3.2 -> 1.0.0
#   minor  — 0.3.2 -> 0.4.0
#   patch  — 0.3.2 -> 0.3.3
#
# What it does, in order:
#   1. Bumps the VERSION file (the single source of truth) via
#      scripts/bump-version.sh and commits the change to main.
#   2. Creates an annotated git tag `v<version>` and pushes it. Pushing the
#      tag fires release.yml, which builds and pushes the container image.
#   3. Creates a GitHub Release for that tag, with auto-generated notes from
#      the commit log since the previous tag.
#
# So a single click does: version bump + commit + tag + image build + release.
#
# Note: this does NOT touch CHANGELOG.md — that file is curated manually. The
# GitHub release notes are auto-generated from the commit log instead.
#
# Secrets needed: none beyond GITHUB_TOKEN (auto-provided). The image push in
# release.yml uses GITHUB_TOKEN for GHCR; a custom registry needs
# REGISTRY_USER / REGISTRY_TOKEN.
name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump kind"
        type: choice
        options: [major, minor, patch]
        default: minor
      release-notes:
        description: "Optional release notes (markdown). Leave blank to auto-generate from the commit log."
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so we can diff against the previous tag for notes.
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          chmod +x scripts/bump-version.sh
          NEW_VERSION="$(./scripts/bump-version.sh ${{ inputs.bump }})"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW_VERSION}"
          git diff VERSION

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          git push

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.bump.outputs.new_version }}" \
            -m "v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Generate release notes
        id: notes
        run: |
          # Use the notes the user typed, if any.
          if [ -n "${{ inputs.release-notes }}" ]; then
            printf '%s' "${{ inputs.release-notes }}" > notes.md
            exit 0
          fi
          # Otherwise, list commits since the previous tag (or the last 20).
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log --no-decorate --pretty='- %s (%h)' "$RANGE"
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --notes-file notes.md \
            --target "${{ github.sha }}"
          echo "Created release v${{ steps.bump.outputs.new_version }}"
