# Reusable workflow: build the Vreckan API image.
#
# Called by ci.yml, release.yml, and nightly-scan.yml so the build (and its
# layer caching) is defined in exactly one place.
#
#   needs: the calling job's id (for `needs.<id>.outputs.image`)
#   inputs:
#     image-name — repository path for the image, e.g. ghcr.io/<owner>/vreckan
#
#   outputs:
#     image — the built image reference (image-name:sha)
name: image-build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Repository path for the image (e.g. ghcr.io/owner/vreckan)"
        required: true
        type: string
    outputs:
      image:
        description: "Built image reference (image-name:sha)"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ inputs.image-name }}:${{ github.sha }}
            ${{ inputs.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose image reference
        id: meta
        run: echo "image=${{ inputs.image-name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
