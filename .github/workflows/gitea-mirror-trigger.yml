# Gitea Mirror + Trigger — the GitHub-side "vLLM pattern" leg.
#
# One workflow, three jobs. The two pipeline jobs (mirror-and-trigger,
# bump-and-tag) stay independent, so a push to main shows a SINGLE run
# (not two) while keeping the two concerns clearly separated; the third job
# pair is the CI gate (ANT-1053, board-approved 2026-11-10):
#
#   pr-gate  (pull_request only) — decides whether a PR runs the pipeline:
#     org members run CI; non-members skip it UNLESS an org member has
#     commented `/allow-ci` on the PR. Re-evaluated on every pull_request
#     action (opened/synchronize/reopened/closed), so a tagged PR also
#     starts building on the author's next push. No checkout step: a few
#     seconds of runner time is the entire cost of a skipped PR.
#   allow-ci  (issue_comment only) — the immediate opt-in: a member
#     `/allow-ci` comment on an open PR targeting main mirrors + dispatches
#     the Gitea build right away. No checkout.
#
#   GATE RULE — the default: non-member PRs do NOT trigger CI (members:
#   yes). The gate is a cost/automation filter, not a security boundary,
#   and a transient membership-API error FAILS OPEN (CI runs). Two
#   caveats: (a) membership is the single default rule — if a bot account
#   is ever ADDED to the vreckan-project org, its PRs start triggering CI
#   again; (b) `/allow-ci` on a member-authored PR re-runs CI (an intended
#   manual re-run). The tag string is the ALLOW_CI_TAG constant below —
#   renaming the command is a one-line change there (docs/ops.md §3.3
#   mirrors this documentation).
#
#   mirror-and-trigger  (push to main + gated pull_request + gated issue_comment)
#     1. Mirrors the current branch to the Gitea mirror repo (vreckan/vreckan).
#        For PRs, the code is mirrored to a `pr/<number>` branch.
#     2. Dispatches the Gitea build workflow in vreckan/vreckan-workflow so the
#        heavy build + test + scan runs on Gitea's own runner.
#     3. When a push to main changes site/ (diff of the push range), also
#        dispatches the site build workflow (build-site.yml) so the
#        vreckan-site image in the Gitea registry tracks main. Pushes that
#        don't touch site/ cost nothing (the diff check is a local git call).
#     4. When a PR is closed (merged or dismissed), deletes its Gitea
#        `pr/<number>` mirror branch so the mirror doesn't accumulate dead
#        branches (ANT-296). For MERGED PRs GitHub coalesces the close
#        event into the push-to-main run (the run's event is `push` and no
#        separate pull_request run is created), so the step also runs on
#        pushes to main and recovers the PR number from the merge. A
#        DISMISSED PR gets no close run at all — GitHub deletes the PR's
#        merge ref (the source pull_request workflows resolve from) when
#        the PR closes, so no run can be created (verified 2026-11-10: two
#        close attempts + four historical dismissed PRs all produced none;
#        a reopen recreates the merge ref and DOES produce a run). The
#        daily branch-sweep leg (routine c6c4011f rule 4) is the cleanup
#        path for dismissed-PR branches. If a pull_request close run ever
#        does fire, steps 1–2 are skipped on it: dispatching a Gitea build
#        for a branch we are about to delete would race the deletion (the
#        build clones the branch by name).
#
#   bump-and-tag  (push to main only)
#     Per-push versioning (ANT-1050): every push to main that changes
#     source becomes a release; docs/site/pipeline/config-only pushes cut
#     no version (the source gate, step 5 below).
#     1. Reads the current VERSION from the repo.
#     2. Tag v<VERSION> does NOT exist (a version-bump PR just landed, or the
#        bump commit's own run) → TAG PATH: create the tag, push it to
#        GitHub, and mirror it to Gitea.
#     3. In the same tag-creation case, dispatches release-rust.yml in
#        vreckan/vreckan-workflow with `tag=v<VERSION>` so the release image
#        is built + pushed to the registries. The dispatch is the release
#        trigger: Gitea Actions has no cross-repo event routing, so a tag
#        push to the MIRROR repo cannot fire a workflow that lives in the
#        workflow repo — the mirror has no .gitea/workflows/ of its own
#        (ANT-1050). A dispatch failure is non-fatal here: the v0.10.1
#        orphaned-Release incident (10-30, ANT-703/ANT-714 — a mid-job
#        failure skipped the Release step and the re-run short-circuited at
#        "tag exists") shows a step failure must not strand the /releases
#        entry. The daily freshness run's "tag without image" early warning
#        (ANT-1050) is the detection path; a manual release-rust dispatch
#        is the recovery.
#     4. In the same tag-creation case, creates the user-facing GitHub
#        Release entry (/releases). Notes: the newest CHANGELOG.md section
#        when this push added one (an explicit release PR), otherwise the
#        push range's commit subjects — for a bump commit's run that range
#        is the bump commit itself, whose message body carries the subjects
#        of the release's actual content (composed by the bump path).
#        Before this step, neither side of the pipeline created the
#        /releases entry — v0.6.2 had to be published by hand (ANT-128).
#     5. Tag v<VERSION> exists AND the push range (widened to the tag's
#        commit when it is newer — see the step) changed no SOURCE path
#        (src/, crates/, server/, Dockerfile, .dockerignore, Cargo.toml,
#        Cargo.lock, rust-toolchain.toml, .base-image-digest) → NO-BUMP
#        PATH: log and skip — no version, no tag, no release, no deploy.
#        Anything outside both the source and known-non-source sets
#        (a new top-level dir, an unfamiliar file) counts as source:
#        when in doubt, ship (user direction 2026-11-11: bump only when
#        source actually changes, never on docs/site).
#     6. Tag v<VERSION> ALREADY EXISTS and source changed (unreleased
#        changes on an already-released version — the common case now) →
#        BUMP PATH:
#        run scripts/bump-version.sh patch (the single place version math
#        lives), commit the VERSION/Cargo.toml/Cargo.lock rewrite as
#        vreckan-ci[bot], then land it on main in two stages: first push it
#        to a staging branch release/bump-<new> (whose push mirrors the
#        branch and dispatches the Gitea build, which posts the three
#        VRECKAN commit statuses the main-protection ruleset requires on
#        every commit pushed to main — a fresh bot commit has none yet, so
#        a direct push is rejected, GH013), wait for those statuses to go
#        green, then push to main. That push re-runs this job; the new
#        version's tag does not exist, so its run takes the tag path and the
#        release is cut. The loop terminates — at most one bot commit per
#        push. On a non-fast-forward push (main moved under the run), the
#        bump re-derives from the new main tip and retries once (re-staging
#        the fresh commit), so back-to-back merges get distinct sequential
#        numbers instead of racing for the same tag.
#     The job is serialized by a concurrency group (cancel-in-progress:
#     false), so queued pushes each run in order. Consequence: every merge
#     to main that touches source is a patch release and, via the
#     deployment's :latest tracking, a production deploy; docs/site/
#     pipeline/config-only merges are mirrored and build-tested but cut no
#     version and deploy nothing (user direction 2026-11-11); minor and
#     major bumps remain explicit PR decisions (see docs/release.md).
#
# The pipeline jobs stay independent where it matters: a tag no-op never
# masks a build failure and vice versa (bump-and-tag has no `needs`).
# mirror-and-trigger `needs` the two gate jobs only to consume their
# decisions on the events those jobs handle. On the other events both
# gates are skipped — and GitHub skips a dependent job whose `needs` are
# ALL skipped, so the job `if` carries an `always()` guard (verified with
# a workflow_dispatch run 2026-11-10, ANT-1056) that keeps push-to-main
# and manual dispatches running; the gate clauses themselves still decide
# (a skipped gate yields empty outputs, which fail the comparison).
#
# This keeps GitHub Actions costs near zero: ~10 seconds of curl + git push
# (plus ~2 membership API calls on PRs), then the real work happens on
# Gitea. A gated-out non-member PR costs a few seconds of runner time and
# nothing on Gitea.
#
# Secrets needed (GitHub):
#   GITEA_URL    — e.g. https://repo.vreckanproject.com
#   GITEA_REPO   — e.g. vreckan/vreckan (the mirror repo)
#   GITEA_TOKEN  — a Gitea PAT with write access to the mirror repo
#   GH_APP_ID    — the vreckan-ci GitHub App ID
#   GH_APP_KEY   — the vreckan-ci GitHub App private key (PEM)
#   (The bump-and-tag job mints a short-lived app installation token from
#    GH_APP_ID + GH_APP_KEY, so the tag is pushed by the app, not a human PAT.)
name: Gitea Mirror + Trigger

# Re-enabled (2026-10-13, D5): the first end-to-end Gitea Rust build is
# green, so the push/PR auto-triggers are armed again. They were commented
# out on 2026-10-12 while the initial push of the port was landing so the
# pre-pipeline repo state didn't fire the mirror + build.
on:
  push:
    # main — the release flow. release/bump-* — per-push bump staging
    # (ANT-1050): the bump commit is pushed there first so the Gitea build
    # dispatched for that push posts the VRECKAN statuses the main-protection
    # ruleset requires on any commit that lands on main.
    branches: [main, 'release/bump-*']
  pull_request:
    branches: [main]
  # The /allow-ci opt-in fires on the comment itself (ANT-1053). GitHub
  # resolves pull_request workflows from the merge ref (PR head merged
  # into base) and issue_comment workflows from the default branch, so
  # for PRs that do not themselves modify this file the gate goes live
  # only once merged to main (this PR's own runs already used it — the
  # merge ref contains the new file).
  issue_comment:
    types: [created]
  workflow_dispatch:

# CI-gate constants (ANT-1053). ALLOW_CI_TAG is the single source for the
# opt-in command — rename it here (and in docs/ops.md §3.3) to change it.
env:
  ALLOW_CI_TAG: "/allow-ci"
  GATE_ORG: "vreckan-project"

jobs:
  pr-gate:
    # Runs on every pull_request action against main (ANT-1053). No
    # checkout: a few seconds of runner time is the entire cost of a
    # skipped PR. The token scopes below are what a fork-PR token has in
    # any case, so the probe works for fork PRs too — exactly the
    # population we gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Note: "org: read" is NOT a valid GITHUB_TOKEN permission scope
      # (actionlint). The membership probe below therefore uses a
      # short-lived vreckan-ci app installation token (204/404 verified
      # pre-merge, ANT-1056 — the GITHUB_TOKEN 302-redirects on that
      # endpoint); the contents/pull-requests/issues scopes here cover
      # the comment and PR fetches, which GITHUB_TOKEN serves fine.
      contents: read
      pull-requests: read
      issues: read
    outputs:
      run-ci: ${{ steps.gate.outputs.run-ci }}
    steps:
      - name: Evaluate CI gate
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
          ORG: ${{ env.GATE_ORG }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.number }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TAG: ${{ env.ALLOW_CI_TAG }}
        run: |
          set -uo pipefail
          echo "=== CI gate (ANT-1053): PR #${PR_NUM} [action: ${ACTION}] by ${AUTHOR} ==="

          # The org-membership endpoint answers 302 (login redirect) for
          # GITHUB_TOKEN on known users — it cannot distinguish members
          # from non-members with that token (verified 2026-11-10, ANT-1056
          # dispatch probe). The vreckan-ci app installation token answers
          # 204/404 correctly, so the probe mints one (same secrets the
          # bump-and-tag job uses — no new secrets). Comment and PR fetches
          # below use GITHUB_TOKEN, which works fine for those. If the mint
          # fails, the probe fails open (treated as member).
          APP_TOKEN=""
          NOW=$(date +%s)
          HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":%s}' "$((NOW-60))" "$((NOW+540))" "$GH_APP_ID" | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          printf '%s' "$GH_APP_KEY" > /tmp/gate-app-key.pem
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign /tmp/gate-app-key.pem | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          JWT="${HEADER}.${PAYLOAD}.${SIG}"
          APP_TOKEN=$(curl -sS -X POST -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$(curl -sS -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/installation" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')/access_tokens" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)
          if [ -z "$APP_TOKEN" ]; then
            echo "WARN: vreckan-ci app token mint failed — membership probe will fail open" >&2
          fi

          # Membership probe: 204 = member, 404 = non-member. Any other
          # code (302/403/5xx) FAILS OPEN (treated as member) with a warning
          # — the gate is a cost/automation filter, not a security boundary,
          # and a transient API error must not block an internal PR.
          check_member() {
            local login="$1" enc code
            # Bot logins contain "[bot]", which must be URL-encoded.
            enc="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$login")"
            local tok="${APP_TOKEN:-$GITHUB_TOKEN}"
            code=$(curl -sS -o /tmp/gate-member.json -w '%{http_code}' \
              -H "Authorization: Bearer $tok" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${ORG}/members/${enc}")
            case "$code" in
              204) echo true ;;
              404) echo false ;;
              *)
                echo "WARN: membership probe for '${login}' returned HTTP ${code} — fail open (treated as member):" >&2
                cat /tmp/gate-member.json >&2 2>/dev/null || true
                echo true
                ;;
            esac
          }

          IS_MEMBER="$(check_member "$AUTHOR")"
          if [ "$IS_MEMBER" = "true" ]; then
            echo "author ${AUTHOR}: org member — run-ci=true"
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "author ${AUTHOR}: not a member — checking for a member ${TAG} opt-in"

          # Memoized membership check for comment authors (same API call,
          # cached per login in this run).
          MEMBERS_FILE="$(mktemp)"
          trap 'rm -f "$MEMBERS_FILE"' EXIT
          is_member() {
            local login="$1" line result
            line="$(grep -F "${login}=" "$MEMBERS_FILE" 2>/dev/null | head -n 1 || true)"
            if [ -n "$line" ]; then
              echo "${line#*=}"
              return 0
            fi
            result="$(check_member "$login")"
            printf '%s=%s\n' "$login" "$result" >> "$MEMBERS_FILE"
            echo "$result"
          }

          # Opt-in: page through the PR's issue comments (capped at 5
          # pages) looking for the tag (case-insensitive substring). A
          # tagged comment only counts when its AUTHOR is an org member;
          # any member tag -> run-ci=true.
          ALLOWED=false
          TAG_LC="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]')"
          for page in 1 2 3 4 5; do
            curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments?per_page=100&page=${page}" \
              > "/tmp/gate-comments-${page}.json" || {
                echo "WARN: comment fetch (page ${page}) failed — fail open (run-ci=true)" >&2
                echo "run-ci=true" >> "$GITHUB_OUTPUT"
                exit 0
              }
            # Tagged comments on this page, as <author><TAB><body snippet>.
            # The process substitution keeps the loop in this shell so
            # ALLOWED survives; the body is trimmed to one log line.
            while IFS="$(printf '\t')" read -r author body; do
              [ -n "$author" ] || continue
              if [ "$(is_member "$author")" = "true" ]; then
                echo "tagged comment by member ${author} (${body:-...}) — run-ci=true"
                ALLOWED=true
              else
                echo "tagged comment by non-member ${author} (${body:-...}) — ignored (logged, no effect)"
              fi
            done < <(jq -r --arg tag "$TAG_LC" '.[] | select(.body != null) | select((.body | ascii_downcase) | contains($tag)) | [(.user.login // ""), ((.body | split("\n") | first) | .[0:80])] | @tsv' "/tmp/gate-comments-${page}.json")
            if [ "$ALLOWED" = "true" ]; then break; fi
            # Stop paging when a page comes back short.
            count="$(jq 'length' "/tmp/gate-comments-${page}.json" 2>/dev/null || echo 0)"
            if [ "${count:-0}" -lt 100 ]; then break; fi
          done

          if [ "$ALLOWED" = "true" ]; then
            echo "member ${TAG} tag present — run-ci=true"
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "not a member — no ${TAG} tag — skipping CI"
            echo "run-ci=false" >> "$GITHUB_OUTPUT"
          fi

  allow-ci:
    # The immediate opt-in (ANT-1053): a member `/allow-ci` comment on an
    # open PR targeting main triggers the mirror + build on the comment
    # itself. No checkout. Trust note: the tag only decides whether to run
    # the pipeline we already run — it grants no write, secret, or merge
    # capability beyond what the mirror/dispatch steps use. Side effect
    # (documented): on a member-authored PR it re-runs CI.
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      trigger: ${{ steps.allow.outputs.trigger }}
      pr_head_sha: ${{ steps.allow.outputs.pr_head_sha }}
    steps:
      - name: Evaluate /allow-ci opt-in
        id: allow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
          ORG: ${{ env.GATE_ORG }}
          REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTOR: ${{ github.event.comment.user.login }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          TAG: ${{ env.ALLOW_CI_TAG }}
        run: |
          set -uo pipefail
          echo "=== /allow-ci opt-in (ANT-1053): comment by ${COMMENTOR} on issue/PR #${ISSUE_NUM} ==="

          # Cheap local pre-filter first (zero API calls): the body must
          # contain the tag and the issue must be a PR. Ordinary issue
          # comments fail here in milliseconds.
          if ! printf '%s' "$COMMENT_BODY" | grep -qiF "$TAG"; then
            echo "no ${TAG} tag in comment — nothing to do"
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "pr_head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_URL" ]; then
            echo "comment is on a plain issue (not a PR) — nothing to do"
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "pr_head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch the PR (one API call).
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${ISSUE_NUM}" > /tmp/allow-ci-pr.json || {
              echo "WARN: PR fetch failed — fail open (triggering anyway)" >&2
              echo "trigger=true" >> "$GITHUB_OUTPUT"
              echo "pr_head_sha=" >> "$GITHUB_OUTPUT"
              exit 0
            }
          BASE_BRANCH="$(jq -r '.base.ref // empty' /tmp/allow-ci-pr.json)"
          PR_STATE="$(jq -r '.state // empty' /tmp/allow-ci-pr.json)"
          PR_AUTHOR="$(jq -r '.user.login // empty' /tmp/allow-ci-pr.json)"
          HEAD_SHA="$(jq -r '.head.sha // empty' /tmp/allow-ci-pr.json)"
          echo "PR #${ISSUE_NUM} by ${PR_AUTHOR}: state=${PR_STATE} base=${BASE_BRANCH} head=${HEAD_SHA:-<unavailable>}"

          if [ "$PR_STATE" != "open" ]; then
            echo "PR is not open (${PR_STATE}) — no trigger"
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "pr_head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE_BRANCH" != "main" ]; then
            echo "PR targets ${BASE_BRANCH}, not main — no trigger"
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "pr_head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Membership of the COMMENT author (not the PR author — the
          # author is precisely the non-member in the opt-in case). The
          # probe uses the vreckan-ci app installation token (204/404; the
          # GITHUB_TOKEN 302-redirects on this endpoint — see pr-gate).
          # Anything other than 204/404 fails OPEN (treated as member).
          APP_TOKEN=""
          NOW=$(date +%s)
          HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":%s}' "$((NOW-60))" "$((NOW+540))" "$GH_APP_ID" | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          printf '%s' "$GH_APP_KEY" > /tmp/allow-ci-app-key.pem
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign /tmp/allow-ci-app-key.pem | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          JWT="${HEADER}.${PAYLOAD}.${SIG}"
          APP_TOKEN=$(curl -sS -X POST -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$(curl -sS -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/installation" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')/access_tokens" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)
          if [ -z "$APP_TOKEN" ]; then
            echo "WARN: vreckan-ci app token mint failed — membership probe will fail open" >&2
          fi
          enc="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$COMMENTOR")"
          code=$(curl -sS -o /tmp/allow-ci-member.json -w '%{http_code}' \
            -H "Authorization: Bearer ${APP_TOKEN:-$GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${ORG}/members/${enc}")
          case "$code" in
            204)
              echo "comment author ${COMMENTOR}: org member — trigger=true"
              echo "trigger=true" >> "$GITHUB_OUTPUT"
              echo "pr_head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "comment author ${COMMENTOR}: not a member — tag ignored (logged, no effect)"
              echo "trigger=false" >> "$GITHUB_OUTPUT"
              echo "pr_head_sha=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "WARN: membership probe for '${COMMENTOR}' returned HTTP ${code} — fail open (triggering anyway):" >&2
              cat /tmp/allow-ci-member.json >&2 2>/dev/null || true
              echo "trigger=true" >> "$GITHUB_OUTPUT"
              echo "pr_head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
              ;;
          esac

  mirror-and-trigger:
    # Gated (ANT-1053): PRs run only when pr-gate said so (member, or a
    # member /allow-ci tag present); the comment path runs only when
    # allow-ci fired. Pushes to main and release/bump-* (per-push bump
    # staging, ANT-1050 — the staging push is what mirrors the branch and
    # dispatches the Gitea build that posts the required statuses), plus
    # manual dispatch, always run. The old fork-skip `if` is subsumed: fork
    # PRs are non-member PRs, so they gate out on membership unless a
    # member tags them — and a tagged fork PR now works because repo
    # secrets ARE exposed to it (the token carries the gate permissions
    # above), so no fork PR is left behind.
    needs: [pr-gate, allow-ci]
    if: >-
      always() && (
      (github.event_name == 'pull_request' && needs.pr-gate.outputs.run-ci == 'true')
      || (github.event_name == 'issue_comment' && needs.allow-ci.outputs.trigger == 'true')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/bump-'))
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # issue_comment carries no PR context: the default checkout is
          # the default-branch HEAD, which would mirror main into pr/<n>.
          # Check out the PR head sha the allow-ci job fetched from the PR
          # (a bare-SHA ref fetches all branches, then the sha itself —
          # fork head commits are reachable via refs/pull/N/head). An
          # empty sha (degraded payload) falls back to github.sha, so the
          # mirror and the Gitea branch-HEAD fetch stay consistent.
          ref: ${{ github.event_name == 'issue_comment' && needs.allow-ci.outputs.pr_head_sha || github.sha }}

      - name: Determine target branch
        # On a PR close the branch is deleted instead of mirrored (step
        # below), so the target only matters for the other events.
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target_branch=pr/${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            # For a PR, github.sha is the MERGE commit (head merged onto base),
            # which does not exist in the mirror. The mirror only has the PR
            # head commit, so build + post status against that instead.
            echo "target_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            # The /allow-ci path: mirror the PR head (the commit we just
            # checked out). Empty sha = degraded payload; the Gitea fetch
            # then falls back to the pr/<n> branch HEAD, which is the same
            # commit we just mirrored (build-test-rust.yml fetch step).
            echo "target_branch=pr/${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "target_sha=${{ needs.allow-ci.outputs.pr_head_sha }}" >> "$GITHUB_OUTPUT"
          else
            # push: mirror the branch that was pushed (main, or the
            # release/bump-* staging branch whose Gitea build posts the
            # required VRECKAN statuses for the bump commit).
            echo "target_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "target_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror to Gitea
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        run: |
          chmod +x scripts/mirror-to-gitea.sh
          ./scripts/mirror-to-gitea.sh

      - name: Trigger Gitea build
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_WORKFLOW_REPO: vreckan/vreckan-workflow
          GITEA_WORKFLOW: build-test-rust.yml
          # The dispatch ref must name a branch in the WORKFLOW repo (where
          # build-test.yml lives) so Gitea can read the workflow file — that's
          # always main. The branch to actually BUILD is passed as the `branch`
          # input (a mirror branch like pr/<n>), which the workflow's fetch
          # step clones from the mirror. Using pr/<n> as the ref would fail,
          # since that branch only exists in the mirror, not the workflow repo.
          GITEA_REF: "refs/heads/main"
          # Pass the values as plain scalars and build the JSON in the shell.
          # Building it inline with ${{ }} in YAML made the Actions expression
          # evaluator leak a stray '}' into the value (HTTP 422 on dispatch).
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          chmod +x scripts/trigger-gitea.sh
          ./scripts/trigger-gitea.sh

      - name: Delete Gitea PR mirror branch
        # PR closed — the mirror branch is dead and should go (ANT-296).
        # Entry paths:
        #   push to main — the path that actually fires for merged PRs:
        #     GitHub coalesces the close event into this push run (event is
        #     `push`, no separate pull_request run), so the number is
        #     recovered from the merge: the merge-commit subject locally
        #     first (fast, no network, the common case), then the GitHub
        #     API (covers squash/rebase, where the subject is the PR
        #     title, not "Merge pull request #N"). Ordinary (non-PR)
        #     pushes are a no-op.
        #   pull_request/closed — fires only when GitHub still resolves a
        #     run for the close. Dismissed-PR closes usually get NO run at
        #     all: the merge ref that pull_request workflows resolve from
        #     is deleted when the PR closes (verified 2026-11-10, ANT-1056
        #     — two close attempts plus four historical dismissed PRs,
        #     while a reopen, which recreates the merge ref, did fire a
        #     run). Dismissed-PR branches that never get a close run are
        #     swept by the daily cleanup leg (routine c6c4011f rule 4).
        #     When a close run does fire, the number comes from the event.
        # Idempotent: a 404 means the branch was never mirrored (gated-out
        # non-member PRs never reach the mirror step), was already deleted
        # by the other entry path, or was swept by the daily cleanup job —
        # a no-op. Traced with the gate (ANT-1053): an untagged closed PR
        # is skipped here — and usually produces no close run at all —
        # but its mirror branch never existed in the first place; a
        # tagged-then-closed PR re-see the member tag in pr-gate on the
        # `closed` action when a close run does fire, so it deletes
        # cleanly.
        if: >-
          (github.event_name == 'pull_request' && github.event.action == 'closed')
          || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.number }}"
          else
            # Merge-commit subject, e.g. "Merge pull request #45 from ..." —
            # local and reliable for standard merge commits.
            PR_NUM="$(git log -1 --format=%s "${{ github.sha }}" 2>/dev/null \
              | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' || true)"
            if [ -z "$PR_NUM" ]; then
              # Squash/rebase merges: the commit is associated with the PR in
              # the GitHub API even though the subject is the PR title.
              PR_NUM="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                | jq -r '.[0].number // empty' 2>/dev/null || true)"
            fi
            if [ -z "$PR_NUM" ]; then
              echo "Push to main is not a PR merge — no mirror branch to delete"
              exit 0
            fi
          fi
          BRANCH="pr/${PR_NUM}"
          REPO="$(echo "$GITEA_REPO" | sed 's#^/###')"
          CODE=$(curl -sS -o /tmp/gitea-branch-del.json -w '%{http_code}' -X DELETE \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_URL}/api/v1/repos/${REPO}/branches/${BRANCH}")
          # If the secret holds a user password rather than a PAT, the
          # `token` scheme 401s; fall back to Basic auth with the same
          # x-access-token form the git mirror remote already uses.
          if [ "$CODE" = "401" ]; then
            CODE=$(curl -sS -o /tmp/gitea-branch-del.json -w '%{http_code}' -X DELETE \
              -u "x-access-token:${GITEA_TOKEN}" \
              "${GITEA_URL}/api/v1/repos/${REPO}/branches/${BRANCH}")
          fi
          case "$CODE" in
            200 | 204)
              echo "Deleted Gitea branch ${BRANCH} (PR #${PR_NUM} closed)"
              ;;
            404)
              echo "Gitea branch ${BRANCH} not present — nothing to delete"
              ;;
            *)
              echo "Unexpected HTTP ${CODE} deleting ${BRANCH}:" >&2
              cat /tmp/gitea-branch-del.json >&2 || true
              exit 1
              ;;
          esac

      - name: Check if site/ changed
        id: site-changed
        # Pushes to main only: the site image is built from mirror main, so a
        # PR build (mirrored to pr/<n>) doesn't need a site dispatch.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # First push to main (or a force-push from off-history): diff
            # against the empty tree so the first landing of site/ still
            # counts as a change. fetch-depth: 0 keeps ordinary push
            # ranges (incl. force-pushes) resolvable.
            BASE=$(git hash-object -t tree /dev/null)
          else
            BASE="$BEFORE"
          fi
          # --quiet gates on "any diff at all" without a pipe (pipefail +
          # head would race to SIGPIPE on large diffs). The name-only call
          # only runs to log the first changed path, and its exit is
          # guarded for the same reason.
          if git diff --quiet "$BASE" "$AFTER" -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "site/ unchanged in this push — no site build dispatch"
          else
            FIRST="$(git diff --name-only "$BASE" "$AFTER" -- site/ | head -n 1 || true)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "site/ changed in this push (first: ${FIRST:-?}) — dispatching build-site.yml"
          fi

      - name: Trigger Gitea site build
        if: steps.site-changed.outputs.changed == 'true'
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_WORKFLOW_REPO: vreckan/vreckan-workflow
          GITEA_WORKFLOW: build-site.yml
          # The dispatch ref must name a branch in the WORKFLOW repo (where
          # build-site.yml lives) — that's always main. The branch/SHA to
          # build is passed as the `branch`/`sha` inputs (the mirror is
          # already up to date: the Mirror step above ran first).
          GITEA_REF: "refs/heads/main"
          TARGET_BRANCH: main
          TARGET_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/trigger-gitea.sh
          ./scripts/trigger-gitea.sh

  bump-and-tag:
    # Only meaningful on a push to main. Skipped for PRs and manual
    # dispatches. Serialized (queue, never cancel): back-to-back pushes must
    # each run in order so the tag check and the bump push never race.
    concurrency:
      group: bump-and-tag-main
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Current VERSION: ${VERSION} (tag ${TAG})"

      - name: Mint vreckan-ci app token
        id: apptoken
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
        run: |
          set -euo pipefail
          if ! command -v openssl &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq openssl
          fi
          # Build a short-lived JWT signed with the app's private key, then
          # exchange it for an installation access token. The token acts as the
          # vreckan-ci app (not a personal account) and carries the app's
          # permissions (Contents: write), so the tag push is attributed to the
          # app instead of a human PAT.
          NOW=$(date +%s)
          HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":%s}' "$((NOW-60))" "$((NOW+60))" "$GH_APP_ID" | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          echo "$GH_APP_KEY" > /tmp/gh_app_key.pem
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign /tmp/gh_app_key.pem | base64 -w0 | sed 's/=//g; s/+/-/g; s/\//_/g')
          JWT="${HEADER}.${PAYLOAD}.${SIG}"
          INSTALL_ID=$(curl -sS -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/installation" | jq -r '.id')
          ITOKEN=$(curl -sS -X POST -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${INSTALL_ID}/access_tokens" | jq -r '.token')
          if [ -z "$ITOKEN" ] || [ "$ITOKEN" = "null" ]; then
            echo "Failed to mint app installation token" >&2; exit 1
          fi
          echo "token=$ITOKEN" >> "$GITHUB_OUTPUT"
          echo "Minted vreckan-ci app installation token"

      - name: Check if tag already exists
        id: exists
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          CODE=$(curl -sS -o /tmp/tag-ref.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/${TAG}")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # Dereference the tag to its commit (an annotated tag's ref
            # points at the tag object first) — the bump path needs it as
            # the notes range base: every commit after the last release is
            # unreleased content of the new version.
            REF_OBJ=$(jq -r '.object.sha' /tmp/tag-ref.json)
            REF_TYPE=$(jq -r '.object.type' /tmp/tag-ref.json)
            if [ "$REF_TYPE" = "tag" ]; then
              # /git/tags/{sha} returns the RAW object shape
              # ({object: {sha, type}}), not the repo-tag shape ({commit: {sha}}).
              REF_OBJ=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/git/tags/${REF_OBJ}" \
                | jq -r '.object.sha')
            fi
            if [ "$REF_OBJ" = "null" ] || [ -z "$REF_OBJ" ]; then
              echo "ERROR: could not dereference tag ${TAG} to a commit (ref object type: ${REF_TYPE})" >&2
              exit 1
            fi
            echo "tag_commit=${REF_OBJ}" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists (${REF_OBJ}) — this push takes the bump path."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist — will create."
          fi

      - name: Check if source changed
        id: source-changed
        # The source gate (ANT-1050, user direction 2026-11-11): the bump
        # path fires only when unreleased content actually changed source.
        # SOURCE = what the built image is made from and the build inputs
        # that change the binary: src/, crates/, server/ (the Dockerfile
        # COPYs exactly these plus the Cargo manifests), Dockerfile,
        # .dockerignore, Cargo.toml, Cargo.lock (dependency set),
        # rust-toolchain.toml, .base-image-digest (base image pin).
        # Known non-source: docs/, site/, .github/ (pipeline), scripts/
        # (ops tooling — not baked into the image), docker-compose*.yml
        # (deployment config), *.md, .gitignore, .env.example, deny.toml.
        # Anything outside BOTH sets (a new top-level dir, an unfamiliar
        # file) counts as source: when in doubt, ship.
        #
        # Range: the push range (BEFORE..AFTER; empty-tree base for a
        # first/force push, mirroring the site-changed step). Widened to
        # TAG_COMMIT..AFTER when the tag's commit is newer than the push
        # range's base: a source change that landed in an earlier
        # docs-only push is still unreleased (that push was skipped, so
        # VERSION never advanced), and THIS push must carry the bump —
        # the widening is what makes the skip rule lossless.
        #
        # This step runs only on the bump candidate (tag exists); the tag
        # path needs no gate. Its log line is the run's record of the
        # decision — a future misclassification is visible in the log
        # (first matching path, and the full changed-file list when
        # nothing source matched).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.exists.outputs.exists == 'true'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          TAG_COMMIT="${{ steps.exists.outputs.tag_commit }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # First push to main (or a force-push from off-history): diff
            # against the empty tree so a first landing of source still
            # counts as a change. fetch-depth: 0 keeps ordinary push
            # ranges (incl. force-pushes) resolvable.
            BASE=$(git hash-object -t tree /dev/null)
          else
            BASE="$BEFORE"
          fi
          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "null" ] \
             && git cat-file -e "${TAG_COMMIT}^{commit}" 2>/dev/null \
             && ! git merge-base --is-ancestor "$AFTER" "$TAG_COMMIT"; then
            # The tag's commit is not an ancestor of this tip (it landed
            # after the push range's base — e.g. this push was docs-only
            # and the release was cut by a later bump). Widen to
            # everything since the last release: the skip decision must
            # see source that is still unreleased, not just this push's
            # own delta.
            BASE="$TAG_COMMIT"
            echo "Widening diff range to ${TAG_COMMIT:0:8} (tag commit is newer than the push range base)"
          fi
          SOURCE_PATHS=(src/ crates/ server/ Dockerfile .dockerignore Cargo.toml Cargo.lock rust-toolchain.toml .base-image-digest)
          CHANGED="$(git diff --name-only "$BASE" "$AFTER" -- "${SOURCE_PATHS[@]}")"
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Source changed in ${BASE:0:8}..${AFTER:0:8} (first: $(printf '%s\n' "$CHANGED" | head -n 1)) — bump path"
          else
            ALL="$(git diff --name-only "$BASE" "$AFTER")"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes in ${BASE:0:8}..${AFTER:0:8} — skipping the version bump (no tag, no release, no deploy)"
            if [ -n "$ALL" ]; then
              echo "Changed files (all non-source):"
              printf '%s\n' "$ALL" | sed 's/^/  /'
            else
              echo "Empty push range — nothing changed."
            fi
          fi

      - name: Bump patch version + push (per-push release)
        # The bump path (ANT-1050): the tag for the current VERSION already
        # exists AND the source gate above passed (unreleased content
        # changed a source path), so this push's changes are unreleased on
        # a released version. Bump the patch (scripts/bump-version.sh is
        # the single place version math lives), commit the VERSION/
        # Cargo.toml/
        # Cargo.lock rewrite as vreckan-ci[bot], then land it on main via a
        # short-lived PR (release/bump-<new> -> main). The PR — not a
        # direct push — is the only rules-compatible landing: the
        # main-protection ruleset requires the four VRECKAN commit statuses
        # (posted by the Gitea build the PR run dispatches, against the PR
        # head) AND CodeQL / code-quality results — CodeQL only runs for
        # PRs and default-branch pushes, so a direct push of a fresh
        # staging commit can never satisfy it (GH013: "Code scanning is
        # waiting for results from CodeQL"). Once the PR is mergeable the
        # bot merges it; the merge push re-runs this job and takes the tag
        # path (loop terminates: at most one bot commit per push, because
        # the bump commit's own run sees a version whose tag does not
        # exist). If main moves or a conflicting bump lands while the PR
        # waits, the bump re-derives from the new tip and re-stages, so
        # back-to-back merges get distinct sequential numbers.
        # Release notes: when the push range added no CHANGELOG section,
        # its commit subjects ride in the bump commit's message body — the
        # bump commit's own run (tag path) carries them into the GitHub
        # Release, because that run's push range is only the bump commit.
        # Gated on the source check (step above): the bump path fires only
        # when unreleased content changed a source path. A docs/site/
        # pipeline/config-only push takes neither path — the run ends here
        # after the mirror-and-trigger job did its normal work.
        if: steps.exists.outputs.exists == 'true' && steps.source-changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          PR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          TAG_COMMIT="${{ steps.exists.outputs.tag_commit }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          # PR lifecycle (find/create/poll/merge) runs on the long-lived
          # GITHUB_TOKEN secret — the same token pr-gate/allow-ci use for
          # PR fetches. The app installation token answers 403 on
          # GET /pulls/{n} in this environment even though the
          # installation lists pull_requests: write (observed live on
          # the first PR-based bump: merge state read "null" for a full
          # hour), so the app token keeps its job (git push -> tag) and
          # the PAT handles the PR API.
          PR_AUTH=(-H "Authorization: Bearer $PR_TOKEN" -H "Accept: application/vnd.github+json")
          # The contexts the main-protection ruleset requires as commit
          # statuses (Gitea posts them on whatever commit it builds — for
          # a PR, the head). CodeQL + code quality are NOT statuses; they
          # surface in the PR merge state, which is what we poll.
          REQUIRED_CHECKS=("VRECKAN: Smoke (Rust)" "VRECKAN: Test (Rust)" "VRECKAN: Scan (Rust)" "VRECKAN: i18n Parity (Rust)")
          git config user.name "vreckan-ci[bot]"
          git config user.email "bot@vreckanproject.com"
          # Notes range base = the commit the existing tag points at.
          compose_notes() {
            # $1 = range base. Stdout carries only the note lines (they are
            # captured into the commit message). Explicit release PRs add a
            # CHANGELOG section in their range — the tag path's notes read
            # the file then, so no subjects need carrying. Otherwise carry
            # the range's commit subjects (the new release's content). The
            # diff is captured to a variable before the grep: under
            # pipefail, grep -q on a piped diff can die of SIGPIPE and flip
            # a match into a miss.
            local diff
            diff=$(git diff "$1" HEAD -- CHANGELOG.md)
            if printf '%s\n' "$diff" | grep -q '^+## '; then
              echo "Push range adds a CHANGELOG section — the tag path's notes read it directly" >&2
              return 0
            fi
            # --no-merges: the merge commit's own subject adds nothing the
            # branch commits' subjects don't already say.
            git log --no-merges --reverse --format='- %s' "$1".."${GITHUB_SHA}"
          }
          NOTES="$(compose_notes "$TAG_COMMIT")"
          # Poll the head commit's combined status until every required
          # VRECKAN check is green. Failure/error states fail fast (the
          # Gitea run linked from the status has the log). The Gitea build
          # dispatched by the PR run posts these; observed wall time is
          # ~4 min warm and up to ~50 min when the shared runner is
          # starved, so the budget is generous.
          wait_for_checks() {
            local sha="$1" deadline=$(( $(date +%s) + 3600 )) state ctx ok
            echo "Waiting for the required checks on ${sha:0:8} (posted by the Gitea build for PR #${PR_NUM:-?})"
            while :; do
              ok=0
              for ctx in "${REQUIRED_CHECKS[@]}"; do
                state=$(curl -sS --max-time 30 "${AUTH[@]}" \
                  "${API}/commits/${sha}/status" \
                  | jq -r --arg c "$ctx" '[.statuses[]? | select(.context == $c) | .state] | first // "expected"')
                case "$state" in
                  success) ok=$((ok+1)) ;;
                  failure|error)
                    echo "ERROR: required check '$ctx' reported $state on ${sha:0:8} — the Gitea run linked from the status has the log" >&2
                    return 1 ;;
                esac
              done
              if [ "$ok" = "${#REQUIRED_CHECKS[@]}" ]; then
                echo "All ${#REQUIRED_CHECKS[@]} required checks green on ${sha:0:8}"
                return 0
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "ERROR: timed out (60m) waiting for required checks on ${sha:0:8} — if the Gitea build ran but never posted, re-dispatch build-test-rust.yml with branch=${BUMP_BRANCH} sha=${sha}, then re-run this job" >&2
                return 1
              fi
              sleep 30
            done
          }
          # Wait for the PR to become mergeable. The merge state is GitHub's
          # verdict on the WHOLE ruleset (required statuses + CodeQL +
          # code quality), so it is the single correct gate:
          #   CLEAN  -> merge
          #   BEHIND -> main moved under us (or a conflicting bump landed
          #           and DIRTY-conflicted on the version files) -> the
          #           caller re-derives from the new tip and re-stages
          #   UNSTABLE -> a required check failed -> fail the job
          #   BLOCKED/other -> checks still running -> keep waiting
          wait_for_mergeable() {
            local pr="$1" deadline=$(( $(date +%s) + 3600 )) state last="" code errs=0
            while :; do
              code=$(curl -sS --max-time 30 -o /tmp/pr-state.json -w '%{http_code}' \
                "${PR_AUTH[@]}" "${API}/pulls/${pr}" || echo 000)
              state=$(jq -r .merge_state_status /tmp/pr-state.json 2>/dev/null || echo null)
              if [ "$code" != "200" ] || [ -z "$state" ] || [ "$state" = "null" ]; then
                # A transient API hiccup must not kill the wait: log it,
                # keep polling, give up only after 10 straight bad answers.
                errs=$((errs+1))
                echo "WARN: PR #${pr} state fetch bad (HTTP ${code}, state '${state}', streak ${errs}) — $(head -c 160 /tmp/pr-state.json 2>/dev/null)" >&2
                if [ "$errs" -ge 10 ]; then
                  echo "ERROR: PR #${pr} state unreadable 10 polls in a row (last HTTP ${code}) — re-run this job to continue waiting" >&2
                  return 1
                fi
              else
                errs=0
              fi
              if [ "$state" != "$last" ]; then
                echo "PR #${pr} merge state: ${state}"
                last="$state"
              fi
              case "$state" in
                CLEAN) echo "PR #${pr} is mergeable — every ruleset check is green"; return 0 ;;
                BEHIND|DIRTY) return 3 ;;
                UNSTABLE)
                  echo "ERROR: PR #${pr} is unstable — a required check (VRECKAN/CodeQL/code quality) failed; the run logs have the detail" >&2
                  return 1 ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "ERROR: timed out (60m) waiting for PR #${pr} to become mergeable (last state: ${state}) — re-run this job to continue waiting" >&2
                return 1
              fi
              sleep 30
            done
          }
          try_push() {
            local new
            new=$(./scripts/bump-version.sh patch)
            {
              echo "chore(release): bump to ${new} (per-push release)"
              if [ -n "$NOTES" ]; then
                echo
                echo "$NOTES"
              fi
            } > /tmp/bump-commit-msg
            git add VERSION Cargo.toml Cargo.lock
            git commit -F /tmp/bump-commit-msg
            BUMP_BRANCH="release/bump-${new}"
            BUMP_SHA=$(git rev-parse HEAD)
            # Same extraheader override as the tag push: actions/checkout
            # writes a read-only GITHUB_TOKEN extraheader that would 403
            # the push otherwise; the app token (Contents: write) must win.
            # --force: a retried bump (main moved / conflicting bump)
            # replaces the staging commit, and a re-run of this job is a
            # no-op re-stage.
            git -c http.https://github.com/.extraheader= push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+HEAD:refs/heads/${BUMP_BRANCH}"
            echo "Staged bump commit ${BUMP_SHA:0:8} on ${BUMP_BRANCH}"
            # Open the PR for the staging branch (or find the open one —
            # a re-run or a concurrent cycle may have opened it already).
            # Token split from live observation: the app token creates PRs
            # but 403s on the single-PR read; the PAT reads it but cannot
            # create. Find+create therefore go to the app first with a PAT
            # fallback, and any real failure fails loud (both bodies in
            # the log) instead of polling /pulls/null for an hour.
            PR_NUM=$(curl -sS --max-time 30 -o /tmp/pr-find.json -w '%{http_code}' \
              "${AUTH[@]}" "${API}/pulls?head=${GITHUB_REPOSITORY}/${BUMP_BRANCH}&state=open" || echo 000)
            PRCODE=$PR_NUM
            PR_NUM=""
            if [ "$PRCODE" = "200" ]; then
              PR_NUM=$(jq -r '.[0].number // empty' /tmp/pr-find.json)
            else
              echo "WARN: PR find returned HTTP ${PRCODE} — $(head -c 200 /tmp/pr-find.json 2>/dev/null)" >&2
            fi
            if [ -z "$PR_NUM" ]; then
              CREATE_BODY=$(printf '{"base":"main","head":"%s","title":"chore(release): bump to %s (per-push release)","body":"Per-push patch release (ANT-1050): the tag for the previous version already exists, so this push cuts the next patch. Merged automatically by `bump-and-tag` once every required check (Gitea build statuses + CodeQL + code quality) is green. The release notes ride in this commit message."}' "${BUMP_BRANCH}" "${new}")
              PRCODE=$(curl -sS --max-time 30 -o /tmp/pr-create.json -w '%{http_code}' \
                -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
                -d "${CREATE_BODY}" "${API}/pulls" || echo 000)
              case "$PRCODE" in 401|403|000)
                echo "WARN: PR create with the app token returned HTTP ${PRCODE} — $(head -c 200 /tmp/pr-create.json 2>/dev/null); retrying with the PAT" >&2
                PRCODE=$(curl -sS --max-time 30 -o /tmp/pr-create.json -w '%{http_code}' \
                  -X POST "${PR_AUTH[@]}" -H "Content-Type: application/json" \
                  -d "${CREATE_BODY}" "${API}/pulls" || echo 000)
                ;;
              esac
              if [ "$PRCODE" = "201" ] || [ "$PRCODE" = "200" ]; then
                PR_NUM=$(jq -r '.number // empty' /tmp/pr-create.json)
              else
                echo "ERROR: PR create failed (HTTP ${PRCODE}): $(head -c 300 /tmp/pr-create.json 2>/dev/null)" >&2
              fi
            fi
            if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
              echo "ERROR: could not open/find the bump PR for ${BUMP_BRANCH} — re-run this job (the staging branch is intact)" >&2
              return 1
            fi
            echo "Bump PR #${PR_NUM} open — waiting for it to become mergeable, then merging"
            local wrc=0
            wait_for_mergeable "$PR_NUM" || wrc=$?
            if [ "$wrc" = "3" ]; then
              echo "PR #${PR_NUM} is behind/dirty — main moved (or a conflicting bump landed), re-deriving from the new tip" >&2
              return 3
            fi
            if [ "$wrc" != "0" ]; then
              return "$wrc"
            fi
            local mcode
            mcode=$(curl -sS --max-time 60 -o /tmp/merge-resp.json -w '%{http_code}' \
              -X PUT "${PR_AUTH[@]}" -H "Content-Type: application/json" \
              -d '{"merge_method":"merge"}' "${API}/pulls/${PR_NUM}/merge" || echo 000)
            if [ "$mcode" = "401" ] || [ "$mcode" = "403" ] || [ "$mcode" = "000" ]; then
              echo "WARN: merge with the PAT returned HTTP ${mcode} — $(head -c 200 /tmp/merge-resp.json 2>/dev/null); retrying with the app token" >&2
              sleep 5
              mcode=$(curl -sS --max-time 60 -o /tmp/merge-resp.json -w '%{http_code}' \
                -X PUT "${AUTH[@]}" -H "Content-Type: application/json" \
                -d '{"merge_method":"merge"}' "${API}/pulls/${PR_NUM}/merge" || echo 000)
            fi
            if [ "$mcode" = "200" ] || [ "$mcode" = "202" ]; then
              echo "Merged PR #${PR_NUM} — the merge push re-runs this job and cuts tag v${new}"
              return 0
            fi
            echo "ERROR: merge of PR #${PR_NUM} returned HTTP ${mcode}: $(cat /tmp/merge-resp.json)" >&2
            return 1
          }
          # One re-derive+re-stage on BEHIND/DIRTY (main moved under the
          # PR, or a concurrent bump conflicted on the version files):
          # recompute the bump against the new tip — the new version also
          # covers whatever landed while this run was in flight. Any other
          # failure ends the job; re-run it to continue.
          rc=0
          try_push || rc=$?
          if [ "$rc" = "3" ]; then
            git fetch origin main
            git reset --hard origin/main
            NOTES="$(compose_notes "$TAG_COMMIT")"
            rc=0
            try_push || rc=$?
          fi
          if [ "$rc" != "0" ]; then
            echo "ERROR: per-push bump failed (rc=${rc}) — re-run this job to continue; the staging branch ${BUMP_BRANCH:-?} and its PR (if any) are safe to reuse" >&2
            exit "$rc"
          fi
          # Best-effort: drop the staging branch from GitHub (the merge may
          # have removed it already). The mirror branch is swept by the
          # daily cleanup routine.
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --delete "refs/heads/${BUMP_BRANCH}" || true
      - name: Create tag + push to GitHub
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "vreckan-ci[bot]"
          git config user.email "bot@vreckanproject.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          # actions/checkout writes a git extraheader (into a temp credentials
          # file pulled in via includeIf) that authenticates every github.com
          # request with the (read-only) GITHUB_TOKEN. That overrides the token
          # embedded in the push URL and causes a 403 ("Write access to
          # repository not granted"). Override the extraheader inline for this
          # one command so the app token (which has write access) is actually used.
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$TAG"
          echo "Pushed tag ${TAG} to GitHub"

      - name: Mirror tag to Gitea
        if: steps.exists.outputs.exists == 'false'
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          HOST="${GITEA_URL#https://}"
          AUTH_REMOTE="https://x-access-token:${GITEA_TOKEN}@${HOST}/$(echo "$GITEA_REPO" | sed 's#^/###').git"
          git remote remove gitea 2>/dev/null || true
          git remote add gitea "$AUTH_REMOTE"
          # Push the tag AND the commit it points to (as main) in one shot. The
          # Gitea release workflow clones `--branch <tag>`, which needs the
          # commit to already be in the mirror. The mirror-and-trigger job
          # pushes main in parallel, but pushing it here too removes the race
          # (both push the same commit, so it's a no-op for them).
          git push gitea "$TAG" "HEAD:refs/heads/main"
          echo "Mirrored tag ${TAG} + main to Gitea"

      - name: Trigger Gitea release
        # The deterministic release trigger (ANT-1050). The tag is already in
        # the mirror (step above), so release-rust.yml's fetch step can clone
        # it. The dispatch ref names a branch of the WORKFLOW repo (always
        # main) so Gitea can read the workflow file; the tag itself rides in
        # the `tag` input. Non-fatal on failure (continue-on-error): the
        # Release step below must still run, and the freshness run's early
        # warning flags a tag that never got an image.
        if: steps.exists.outputs.exists == 'false'
        continue-on-error: true
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_WORKFLOW_REPO: vreckan/vreckan-workflow
          GITEA_WORKFLOW: release-rust.yml
          GITEA_REF: "refs/heads/main"
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -uo pipefail
          chmod +x scripts/trigger-gitea.sh
          if GITEA_INPUTS="$(printf '{"tag":"%s"}' "$RELEASE_TAG")" ./scripts/trigger-gitea.sh; then
            echo "Dispatched release-rust.yml for ${RELEASE_TAG}"
          else
            echo "ERROR: release dispatch for ${RELEASE_TAG} failed — the tag is cut but no release run was started. The freshness run's tag-without-image check will flag it; recover with a manual workflow_dispatch of release-rust.yml (tag=${RELEASE_TAG})."
          fi

      - name: Create GitHub Release
        # Only when the tag was just created above. Root cause of the missing
        # v0.6.2 /releases entry: this job only ever cut the git tag, and the
        # Gitea "Release (Rust)" workflow only builds + pushes the image —
        # neither created the GitHub Release (ANT-128). The vreckan-ci app
        # token minted above carries Contents: write, which covers releases.
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # Release notes, two sources (per-push versioning, ANT-1050):
          #  1. This push added a CHANGELOG.md section (an explicit
          #     release PR) → the newest CHANGELOG section, which per
          #     docs/release.md ships in the same PR as the VERSION bump.
          #  2. Otherwise (a per-push bump) → the bump commit's message
          #     with the bump subject stripped: the bump path composed the
          #     release content's commit subjects into that message, so
          #     they surface here as the notes. With the PR-based landing
          #     the tip is a merge commit (empty body) and the bump commit
          #     is its second parent. Falls back to the plain subject when
          #     no subjects were carried (nothing unreleased after the
          #     previous tag).
          ZERO="0000000000000000000000000000000000000000"
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # First push to main (or a force-push from off-history): range
            # against the empty tree so any added section still counts.
            BASE=$(git hash-object -t tree /dev/null)
          fi
          # Capture the diff before the grep: under pipefail, grep -q on a
          # piped diff can die of SIGPIPE and flip a match into a miss.
          if printf '%s\n' "$(git diff "$BASE" HEAD -- CHANGELOG.md)" | grep -q '^+## '; then
            awk '/^## /{if (found) exit; found=1} found' CHANGELOG.md > /tmp/release-notes.md
            if [ ! -s /tmp/release-notes.md ]; then
              echo "WARNING: no changelog section found — using fallback notes" >&2
              echo "Release ${TAG}" > /tmp/release-notes.md
            fi
          else
            # The tip is a merge commit only on the PR-based landing; its
            # body is empty and the notes live on the second parent (the
            # bump commit). A direct tip (legacy/dry runs) is read as-is.
            if [ "$(git cat-file -p "${GITHUB_SHA}" 2>/dev/null | grep -c '^parent ')" -ge 2 ]; then
              MSG="$(git log -1 --format=%B "${GITHUB_SHA}^2")"
            else
              MSG="$(git log -1 --format=%B "${GITHUB_SHA}")"
            fi
            NOTES="$(printf '%s\n' "$MSG" | sed '1,/^$/d' | sed '1{/^chore(release): bump to /d}')"
            if [ -z "$NOTES" ]; then
              NOTES="${MSG%%$'\n'*}"
              case "$NOTES" in
                chore\(release\):*) NOTES="Release ${TAG}" ;;
              esac
            fi
            printf '%s\n' "$NOTES" > /tmp/release-notes.md
          fi
          # `gh` is preinstalled on ubuntu-latest and resolves GITHUB_REPOSITORY
          # from the Actions context. --target pins the release to the tagged
          # commit (the merge that triggered this run).
          gh release create "$TAG" --target "${GITHUB_SHA}" \
            --title "Release ${TAG}" --notes-file /tmp/release-notes.md
          echo "Created GitHub Release ${TAG}"
