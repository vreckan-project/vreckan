        label_key: host
        label: "Host"
      - value: "none"
        label_key: none
        label: "None"
      - value: "bridge"
        label_key: bridge
        label: "Bridge"
  - name: DOCKER_IPC_MODE
    label: "IPC Mode"
    description: "Set the IPC mode for the container."
    category: docker
    type: select
    default: ""
    docker: true
    options:
      - value: ""
        label_key: default
        label: "Default"
      - value: "host"
        label_key: host
        label: "Host"
      - value: "private"
        label_key: private
        label: "Private"
      - value: "shareable"
        label_key: shareable
        label: "Shareable"
  - name: DOCKER_PID_MODE
    label: "PID Mode"
    description: "Set the PID mode for the container."
    category: docker
    type: select
    default: ""
    docker: true
    options:
      - value: ""
        label_key: default
        label: "Default"
      - value: "host"
        label_key: host
        label: "Host"
  - name: DOCKER_DNS
    label: "DNS Servers"
    description: "Custom DNS servers (comma separated)."
    category: docker
