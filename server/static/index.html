<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vreckan</title>
<link rel="icon" type="image/png" href="/img/icon128.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <!-- ===== Login view ===== -->
  <section id="view-login" class="view" hidden>
    <div class="login-card card">
      <div class="login-brand">
        <img src="/img/vreckan-wordmark.svg" alt="Vreckan" class="brand-wordmark">
      </div>
      <form id="login-form" autocomplete="on">
        <label data-i18n="common.username">Username
          <input type="text" id="login-username" name="username" autocomplete="username" required>
        </label>
        <label data-i18n="common.password">Password
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit" data-i18n="login.signIn">Sign in</button>
        <div id="login-sso-divider" class="sso-divider" hidden><span data-i18n="login.or">or</span></div>
        <button type="button" class="btn btn-block" id="login-sso" hidden data-i18n="login.sso">Sign in with SSO</button>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>
    </div>
  </section>

  <!-- ===== App shell: persistent sidebar + views (Feat 5) ===== -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-header" id="brand-home">
        <img src="/img/vreckan-wordmark.svg" alt="Vreckan" class="brand-wordmark">
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <div class="nav-group">
          <button id="tab-apps" class="nav-link active" data-view="main" data-i18n="nav.apps">Apps</button>
          <button id="tab-files" class="nav-link" data-view="files" hidden data-i18n="nav.files">Files</button>
        </div>
        <div class="nav-group admin-group" data-admin-group="access" hidden>
          <div class="nav-group-label" data-i18n="nav.access">Access</div>
          <button class="nav-link admin-link" data-admin-section="overview" hidden data-i18n="nav.overview">Overview</button>
          <button class="nav-link admin-link" data-admin-section="accounts" hidden data-i18n="nav.accounts">Accounts</button>
          <button class="nav-link admin-link" data-admin-section="groups" hidden data-i18n="nav.groups">Groups</button>
          <button class="nav-link admin-link" data-admin-section="roles" hidden data-i18n="nav.roles">Roles</button>
          <button class="nav-link admin-link" data-admin-section="sso" hidden data-i18n="nav.sso">SSO</button>
        </div>
        <div class="nav-group admin-group" data-admin-group="apps" hidden>
          <div class="nav-group-label" data-i18n="nav.apps">Apps</div>
          <button class="nav-link admin-link" data-admin-section="apps" hidden data-i18n="nav.installedApps">Control</button>
          <button class="nav-link admin-link" data-admin-section="templates" hidden data-i18n="nav.templates">Templates<span class="nav-beta">BETA</span></button>
          <button class="nav-link admin-link" data-admin-section="laboratory" hidden data-i18n="nav.laboratory">Laboratory<span class="nav-beta">BETA</span></button>
        </div>
        <div class="nav-group admin-group" data-admin-group="system" hidden>
          <div class="nav-group-label" data-i18n="nav.system">System</div>
          <button class="nav-link admin-link" data-admin-section="global-settings" hidden data-i18n="nav.globalSettings">Global Settings</button>
          <button class="nav-link admin-link" data-admin-section="mounts" hidden data-i18n="nav.volumeMounts">Volume mounts</button>
          <button class="nav-link admin-link" data-admin-section="backup" hidden data-i18n="nav.backup">Backup</button>
          <button class="nav-link admin-link" data-admin-section="sessions" hidden data-i18n="nav.sessions">Sessions</button>
          <button class="nav-link admin-link" data-admin-section="certificates" hidden data-i18n="nav.certificates">Certificates</button>
        </div>
      </nav>
      <div class="sidebar-footer">
        <span id="user-label" class="muted"></span>
        <div class="sidebar-footer-actions">
          <button id="btn-change-password" class="btn btn-ghost btn-sm" data-i18n="nav.password">Password</button>
          <button id="btn-logout" class="btn btn-ghost btn-sm" data-i18n="nav.signOut">Sign out</button>
        </div>
        <div class="lang-select-wrap" id="lang-select-wrap" data-i18n-title="common.language" title="Language" hidden>
          <select id="lang-select" class="lang-select" aria-label="Language"></select>
          <button id="lang-apply" class="btn btn-ghost btn-sm" data-i18n="common.apply">Apply</button>
        </div>
      </div>
    </aside>

    <div class="main-area">

  <!-- ===== Main view ===== -->
  <section id="view-main" class="view" hidden>
    <main class="content">
      <!-- Launch options -->
      <div class="launch-options card">
        <div class="field">
          <label for="opt-home" data-i18n="launch.homeDirectory">Home directory</label>
          <div class="field-inline">
            <select id="opt-home">
              <option value="auto" selected data-i18n="launch.auto">Auto</option>
              <option value="cleanroom" data-i18n="launch.cleanroom">Cleanroom</option>
            </select>
            <button id="btn-manage-homedirs" class="btn btn-ghost btn-sm" type="button" hidden data-i18n="common.manage">Manage</button>
          </div>
        </div>
        <div class="field">
          <label for="opt-language" data-i18n="common.language">Language</label>
          <select id="opt-language"></select>
        </div>
        <div class="field" id="field-gpu" hidden>
          <label for="opt-gpu" data-i18n="common.gpu">GPU</label>
          <select id="opt-gpu"></select>
        </div>
        <div class="field field-row">
          <label class="check">
            <input type="checkbox" id="opt-room-mode">
            <span data-i18n="launch.roomMode">Launch in room mode</span>
          </label>
        </div>
        <div class="field field-row">
          <label class="check">
            <input type="checkbox" id="opt-wayland" checked>
            <span data-i18n="launch.wayland">Wayland</span>
          </label>
        </div>
        <div class="field field-row">
          <button type="button" class="btn btn-ghost btn-sm" id="btn-save-preset" data-i18n="launch.savePreset">Save these launch options as a preset</button>
        </div>
        <div class="field field-row">
          <button type="button" class="btn btn-ghost btn-sm" id="btn-upload-storage" hidden data-i18n="launch.uploadStorage">Upload a file to shared storage</button>
        </div>
      </div>

      <!-- Pinned launch options (Feat 7) -->
      <div id="pinned-section" hidden>
        <h2 class="section-title" data-i18n="launch.pinned">Pinned</h2>
        <div id="pinned-list" class="pinned-list"></div>
      </div>

      <!-- Launcher -->
      <h2 class="section-title" data-i18n="nav.apps">Apps</h2>
      <div id="app-grid" class="app-grid">
        <div class="skeleton skeleton-app"></div>
        <div class="skeleton skeleton-app"></div>
        <div class="skeleton skeleton-app"></div>
      </div>

      <!-- Sessions -->
      <h2 class="section-title" data-i18n="launch.activeSessions">Active sessions</h2>
      <div id="sessions-list" class="sessions-list">
        <p class="muted" data-i18n="launch.noSessions">No active sessions.</p>
      </div>
    </main>
  </section>

  <!-- ===== Files view ===== -->
  <section id="view-files" class="view" hidden>
    <div class="content">
      <div class="fm-toolbar card">
        <label class="field">
          <span class="label" data-i18n="files.folder">Folder</span>
          <select id="fm-home"></select>
        </label>
        <div id="fm-breadcrumb" class="fm-crumbs"></div>
        <div class="fm-actions">
          <button id="fm-up" class="btn btn-ghost" data-i18n="files.up" data-i18n-title="files.upOneLevel" title="Up one level">Up</button>
          <button id="fm-refresh" class="btn btn-ghost" data-i18n-title="common.refresh" title="Refresh" data-i18n="common.refresh">Refresh</button>
          <button id="fm-new-folder" class="btn btn-ghost" data-i18n="files.newFolder">New folder</button>
          <button id="fm-upload" class="btn btn-ghost" data-i18n="common.upload">Upload</button>
          <input type="file" id="fm-upload-input" multiple hidden>
          <button id="fm-download" class="btn btn-primary" disabled data-i18n="common.download">Download</button>
          <button id="fm-share" class="btn btn-primary" disabled data-i18n="common.share">Share</button>
          <button id="fm-open-in-app" class="btn btn-primary" disabled data-i18n="files.openInApp">Open in app</button>
          <button id="fm-delete" class="btn btn-danger" disabled data-i18n="common.delete">Delete</button>
          <button id="fm-shares-btn" class="btn btn-ghost" data-i18n="files.shares">Shares</button>
        </div>
      </div>

      <div id="fm-progress" class="fm-progress" hidden></div>

      <div class="card">
        <table class="fm-table" id="fm-table">
          <thead>
            <tr>
              <th class="fm-col-sel"><input type="checkbox" id="fm-select-all"></th>
              <th data-i18n="common.name">Name</th>
              <th data-i18n="files.size">Size</th>
              <th data-i18n="files.modified">Modified</th>
            </tr>
          </thead>
          <tbody id="fm-body"></tbody>
        </table>
        <p id="fm-empty" class="empty-state" hidden data-i18n="files.empty">No files here.</p>
      </div>

      <div class="fm-pager">
        <button id="fm-prev" class="btn btn-ghost" disabled data-i18n="common.previous">Prev</button>
        <span id="fm-page-info" class="muted">Page 1</span>
        <button id="fm-next" class="btn btn-ghost" disabled data-i18n="common.next">Next</button>
      </div>

      <!-- Shares panel -->
      <div id="fm-shares-panel" class="card" hidden>
        <h2 class="section-title" data-i18n="files.activeShares">Active shares</h2>
        <div id="fm-shares-list"></div>
      </div>
    </div>
  </section>

  <!-- ===== Admin view ===== -->
  <section id="view-admin" class="view" hidden>
    <div class="content admin-content">
      <div class="admin-panel">
        <div id="admin-section"></div>
      </div>
    </div>
  </section>
    </div><!-- /.main-area -->
  </div><!-- /#shell -->
</div><!-- /#app -->

<!-- ===== Change password modal ===== -->
<div id="modal-password" class="modal-backdrop" hidden>
  <div class="modal card">
    <h3 data-i18n="password.title">Change password</h3>
    <form id="change-password-form">
      <label data-i18n="password.current">Current password
        <input type="password" id="cp-old" required autocomplete="current-password">
      </label>
      <label data-i18n="password.new">New password
        <input type="password" id="cp-new" required autocomplete="new-password">
      </label>
      <label data-i18n="password.confirm">Confirm new password
        <input type="password" id="cp-confirm" required autocomplete="new-password">
      </label>
      <p id="cp-error" class="error" role="alert" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cp-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" data-i18n="common.save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== File share modal ===== -->
<div id="modal-file-share" class="modal-backdrop" hidden>
  <div class="modal card">
    <h3 data-i18n="share.title">Share file</h3>
    <p id="file-share-path" class="muted"></p>
    <form id="file-share-form">
      <label data-i18n="share.passwordLabel">Password (optional)
        <input type="password" id="fs-password" autocomplete="off">
      </label>
      <label data-i18n="share.expiryLabel">Expires in hours (optional)
        <input type="number" id="fs-expiry" min="1" placeholder="e.g. 72">
      </label>
      <p id="fs-error" class="error" role="alert" hidden></p>
      <div id="fs-result" hidden>
        <p class="muted" data-i18n="share.linkLabel">Share link:</p>
        <div class="fm-share-url">
          <code id="fs-url"></code>
          <button type="button" class="btn btn-primary btn-sm" id="fs-copy" data-i18n="common.copy">Copy</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="fs-cancel" data-i18n="common.close">Close</button>
        <button type="submit" class="btn btn-primary" data-i18n="common.create">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Share modal ===== -->
<div id="modal-share" class="modal-backdrop" hidden>
  <div class="modal card">
    <h3 data-i18n="common.share">Share</h3>
    <form id="share-form">
      <label data-i18n="share.withLabel">Share with
        <input type="text" id="sh-to" required>
      </label>
      <p id="sh-error" class="error" role="alert" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="sh-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" data-i18n="common.share">Share</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Launch modal (file-backed apps — Feat 12) ===== -->
<div id="modal-launch" class="modal-backdrop" hidden>
  <div class="modal card">
    <h3 id="launch-title" data-i18n="launch.title">Launch app</h3>
    <p class="muted" id="launch-sub" data-i18n="launch.subtitle">The app will launch without opening a file. Check "Open file on launch" to pick one.</p>
    <form id="launch-form">
      <div class="field">
        <label for="launch-name" data-i18n="launch.sessionName">Session name (optional)</label>
        <input type="text" id="launch-name" data-i18n-placeholder="launch.sessionNamePlaceholder" placeholder="Appears in the window title and session list">
      </div>
      <div class="field field-row">
        <label class="check">
          <input type="checkbox" id="launch-open-on-launch">
          <span data-i18n="launch.openFileOnLaunch">Open file on launch</span>
        </label>
      </div>
      <div id="launch-file-fields" hidden>
        <div class="field">
          <label for="launch-file" data-i18n="launch.fileToOpen">File to open (optional, from your computer)</label>
          <input type="file" id="launch-file">
        </div>
        <p id="launch-upload-status" class="muted" hidden></p>
        <hr>
        <div class="field">
          <label for="launch-server-file" data-i18n="launch.serverFile">Or open a file already in shared storage</label>
          <input type="text" id="launch-server-file" data-i18n-placeholder="launch.serverFilePlaceholder" placeholder="filename in shared storage">
        </div>
      </div>
      <p id="launch-error" class="error" role="alert" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="launch-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="launch-submit" data-i18n="launch.launch">Launch</button>
      </div>
    </form>
  </div>
</div>

<!-- Hidden file picker for "Send File" on a session (Feat 9) -->
<input type="file" id="session-send-file" hidden>
<!-- Hidden file picker for "Upload to Storage" (Feat 10) -->
<input type="file" id="storage-upload-input" hidden>

<!-- ===== Toasts ===== -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/js/entry.js"></script>
</body>
</html>
