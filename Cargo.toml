[package]
name = "vreckan"
version = "0.6.2"
edition = "2021"
description = "Vreckan server (Rust port of the Python/FastAPI server)"
# MPL-2.0 to match the upstream SealSkin fork this project derives from (see
# LICENSE). The Rust source is a net-new implementation; the served web client
# under `server/static/` carries over SealSkin-licensed files (see the
# per-file notes in the repo).
license = "MPL-2.0"

[[bin]]
name = "vreckan"
path = "src/main.rs"

[dependencies]
# HTTP server + routing
axum = { version = "0.8", features = ["macros", "query", "json", "multipart", "ws", "http2", "form"] }
axum-extra = { version = "0.12", features = ["cookie"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
axum-reverse-proxy = "2.2"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.30"
# Object-safe async trait (the `CertbotDocker` trait in `le_certbot.rs`).
async-trait = "0.1"

# Database (SeaORM — Django-like ORM over sqlx; multi-backend: SQLite/Postgres/MySQL)
sea-orm = { version = "2.0", features = ["runtime-tokio", "sqlx-all", "with-json", "macros", "schema-sync"] }
# `log::LevelFilter` is the type sea-orm's `ConnectOptions::sqlx_logging_level`
# takes, so we need it as a direct dependency to configure SQL query logging.
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML (app templates, app-store catalogs, template schema baseline).
serde_yaml = "0.9"

# Crypto (E2EE + password hashing)
ring = "0.17"
argon2 = "0.6"
sha2 = "0.10"
base64 = "0.23"
rand = "0.10"
# E2EE handshake: RSA-PSS (server identity) + RSA-OAEP (session-key wrap).
# `sha2` is not a default feature of `rsa`, so enable it explicitly.
rsa = { version = "0.9", features = ["sha2"] }
# E2EE payload: AES-256-GCM with the session id as AAD.
aes-gcm = "0.11"
# Key encoding (PKCS#8 private key load, SPKI public-key PEM).
pkcs8 = { version = "0.11", features = ["alloc", "pem"] }
# 0.10-era alias: `rsa 0.9`/`pkcs1 0.7` implement the pkcs8 0.10 traits, so the
# E2EE RSA-key PEM encode/decode in `e2ee.rs` (and the test helpers) need the
# 0.10 trait API until `rsa` reaches the der-0.8/pkcs8-0.11 generation.
pkcs8_010 = { package = "pkcs8", version = "0.10", features = ["alloc", "pem"] }
spki = "0.7"
der = "0.8"
# `rsa 0.9` is built against `rand_core 0.6`; use its `OsRng` for one-time
# server-key generation (our `rand 0.10` uses `rand_core 0.10`, a different
# trait version, so it can't be passed to `rsa` directly).
rand_core = { version = "0.10", features = ["getrandom"] }

# OIDC / SSO
openid = "0.25"
jwks = "0.5"
# JWT (id_token) decode + RS256 signature verification. Pinned to the same
# major as the `jwks` dependency so the `DecodingKey` types line up.
jsonwebtoken = "10"

# Docker Engine API
bollard = "0.21"

# Outbound HTTP (app stores, health checks, OIDC transport)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form"] }

# Backup / restore
tar = "0.4"
flate2 = "1"

# TLS / certs
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
x509-cert = "0.3"
rcgen = "0.14"
# Native ACME client (replaces the certbot sidecar container for Let's
# Encrypt issuance; see `src/acme.rs` and `src/le_certbot.rs`). Default crypto
# is aws-lc-rs (already in the tree via rcgen). DNS-01 providers are feature
# gated — Cloudflare is the default; the rest are available for users who
# manage DNS elsewhere (ANT-128). `zerossl-ca`/`google-ca` add those CAs.
acmex = { version = "0.8", features = [
  "dns-cloudflare", "dns-route53", "dns-digitalocean", "dns-linode",
  "dns-azure", "dns-google", "dns-alibaba", "dns-godaddy",
  "dns-tencent", "dns-huawei", "dns-cloudns",
  "zerossl-ca", "google-ca",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# `time` is a transitive dep of `rcgen`; used directly in tests to build
# custom certificate validity windows (rcgen's `OffsetDateTime`).
time = "0.3"
url = "2"
mime_guess = "2"
hex = "0.4"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
# Direct router invocation in integration tests (no real socket needed).
tower = { version = "0.5", features = ["util"] }
# TLS client for the hot-reload test (already in the tree via axum-server; a
# direct dev-dep so the test can drive a real client handshake).
tokio-rustls = "0.26"

# The published `acmex` 0.8.0 hard-codes the ACME account key as Ed25519 and
# signs every JWS with `alg: EdDSA`, but Let's Encrypt production no longer
# accepts EdDSA (2026-10: RS256/ES256/ES384/ES512 only) — registration fails
# and the `Location`-header check masks the real 400 (ANT-138). Upstream
# derives the JWS `alg` and JWK from the actual key (`Jwk::for_key_pair`,
# `JwsSigner::jwa_algorithm`) and adds `KeyPairGenerator`, so we pin an
# `antitux/acmex` fork (of houseme/acmex @ f7b06c2) with six fixes:
#   1. the `contact` field in account responses is defaulted — Boulder
#      omits it when the account has no contacts, which broke parsing;
#   2. POST-as-GET reads (order/authz/cert lookup, account lookup) use
#      an empty payload — Boulder rejects the `e30` (`{}`) encoding with
#      "must have an empty payload";
#   3. order polling is budgeted at 5 minutes per stage (60s was below
#      Let's Encrypt's dns-01 validation cadence — first attempts fail
#      during DNS propagation and retries come minutes later);
#   4. challenge *activation* must POST an empty object (`{` + `}`), not
#      an empty payload — an empty payload is a POST-as-GET (fetch only)
#      and never triggers validation (RFC 8555 7.5.1), so
#      challenges sat "pending" forever;
#   5. CSR subject CN: rcgen's default DN is CN="rcgen self signed
#      cert", which Boulder rejects ("Domain name contains an invalid
#      character"); the fork sets the CN to the first identifier;
#   6. the Cloudflare provider's TXT create is idempotent — Cloudflare
#      81058 ("An identical record already exists") fires when a CA
#      reuses a still-valid authorization (same token, same digest) and
#      a previous run left the record in place; the fork reuses the
#      existing record instead of failing the issuance.
# We generate ECDSA P-256 account keys (ES256), accepted by all three
# supported CAs. Revert to the crates.io release once the fixes ship in a
# published version.
[patch.crates-io]
acmex = { git = "https://github.com/antitux/acmex", rev = "261817d654bff17e730421861c4a71a57d904c88" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# CI test profile: thin-LTO (vs fat) and 16 codegen units (vs 1) cut the
# ~24 test-binary compiles roughly in half while keeping cross-crate
# optimisation. The production binary still uses the release profile above.
[profile.test-release]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
