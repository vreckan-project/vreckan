[workspace]
members = [
    ".",
    "crates/vreckan-core",
    "crates/vreckan-acme",
    "crates/vreckan-auth",
    "crates/vreckan-collab",
    "crates/vreckan-sessions",
    "crates/vreckan-catalog",
    "crates/vreckan-files",
    "crates/vreckan-admin",
    "crates/vreckan-test-support",
]
resolver = "2"

# Candidate C (ANT-662 Phase 2 / ANT-770) split the former single lib+bin
# into domain crates plus this thin `vreckan` package (lib facade + bin);
# the Candidate B central-cluster split (Phase 3 / ANT-812) then dissolved
# `vreckan-apps` into `vreckan-collab`, `vreckan-sessions`,
# `vreckan-catalog` (catalog + docker provider), and `vreckan-files`, with
# `backup_manager` moving to `vreckan-admin`. The public `vreckan` package
# name is preserved: the lib re-exports every former top-level module, so
# downstream dependents' `Cargo.toml` and `use vreckan::...` paths are
# unaffected.

[workspace.package]
# Single version shared by all six workspace crates via
# `version = { workspace = true }` (Candidate C split, ANT-770). Bumped
# 0.10.7 -> 0.11.0 for the v0.11.0 cut that ships the split (ANT-775).
version = "0.11.4"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
# HTTP server + routing
axum = { version = "0.8", features = ["macros", "query", "json", "multipart", "ws", "http2", "form"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
# Per-connection HTTP driver for the manual accept loop in `serve.rs`
# (the same hyper-util pieces axum-server uses internally; ANT-652).
# `server-auto` enables the http1/h2 `auto` conn builder; `service` enables
# `TowerToHyperService`; `tokio` enables `rt::{TokioIo, TokioExecutor}`.
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http = "1"
http-body-util = "0.1"
futures-util = "0.3"
# Pinned to the 0.29 line axum's `ws` feature already resolves (ANT-854),
# collapsing the lock to a single tungstenite/tokio-tungstenite version.
tokio-tungstenite = "0.29"
# Per-connection service plumbing for the manual accept loop in
# `serve.rs` (ANT-652); also used by integration tests.
tower = { version = "0.5", features = ["util"] }
# TLS acceptor for the same-port HTTP/HTTPS dispatch (ANT-652); the ACME
# tests use it on the client side too.
tokio-rustls = "0.26"
# Object-safe async trait (the `CertbotDocker` trait in `le_certbot.rs`).
async-trait = "0.1"

# Database (SeaORM — Django-like ORM over sqlx; multi-backend: SQLite/Postgres/MySQL)
sea-orm = { version = "2.0", features = ["runtime-tokio", "sqlx-all", "with-json", "macros", "schema-sync"] }
# `log::LevelFilter` is the type sea-orm's `ConnectOptions::sqlx_logging_level`
# takes, so we need it as a direct dependency to configure SQL query logging.
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML (app templates, app-store catalogs, template schema baseline).
serde_yaml = "0.9"

# Crypto (E2EE + password hashing)
argon2 = "0.6"
# `sha2` 0.11 (digest 0.11) matches the version `rsa 0.10` is built against
# and re-exports, so the `Sha256`/`Digest` types used for the PSS/OAEP
# handshake line up with `rsa`'s own (ANT-191).
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
# E2EE handshake: RSA-PSS (server identity) + RSA-OAEP (session-key wrap).
# As of 0.10.0-rc.20 `sha2` is a required dep of `rsa` (no longer optional),
# so there is no `sha2` feature to name and `rsa::sha2` is always re-exported
# — the old `features = ["sha2"]` pin no longer resolves.
# `rsa 0.10` is the first release built on the pkcs8 0.11 / spki 0.8 /
# der 0.8 / rand_core 0.10 stack (0.9.x stays on pkcs8 0.10 / spki 0.7 /
# rand_core 0.6), so it is bumped in lockstep with the pins below, replacing
# the `pkcs8_010`/`rand_core_06` alias workaround (ANT-183/ANT-191).
rsa = "0.10.0-rc.20"
# E2EE payload: AES-256-GCM with the session id as AAD.
aes-gcm = "0.11"
# Key encoding (PKCS#8 private key load, SPKI public-key PEM). Must stay on
# the same versions `rsa` implements its traits against — the old
# pkcs8 0.10 / spki 0.7 (pem-rfc7468 0.7) `LineEnding` is a distinct type
# from pkcs8 0.11 / spki 0.8 (pem-rfc7468 1.0)'s (ANT-191). The older
# majors remain in the tree via `jsonwebtoken`'s `rust_crypto` feature, but
# vreckan only crosses that boundary with opaque PEM bytes.
pkcs8 = { version = "0.11", features = ["alloc", "pem"] }
spki = "0.8"
der = "0.8"

# OIDC / SSO — JWT (id_token) decode + RS256 signature verification. The
# JWKS fetch is hand-rolled on reqwest in src/auth.rs (ANT-855), so the
# `jwks` crate and its `jsonwebtoken` v10 companion are gone. v11 is a
# breaking bump (non_exhaustive types, removed `Validation::insecure_
# disable_signature_validation`, reworked feature gates); vreckan's call
# sites in src/auth.rs and the test suites were audited against it (ANT-246).
# `rust_crypto` must be enabled explicitly: v11 selects its process-level
# CryptoProvider from this feature (exactly one of rust_crypto/aws_lc_rs),
# and nothing else names v11, so without it RS256 verification panics at
# runtime. The feature keeps the v10-era crypto family (rsa/p256/p384/
# ed25519-dalek/sha2/hmac/rand) in the tree — it survives until the
# crypto-bigint 0.5.5 removal lands under ANT-546.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

# Docker Engine API
bollard = "0.21"

# Outbound HTTP (app stores, health checks, OIDC transport)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form"] }

# Backup / restore
tar = "0.4"
flate2 = "1"

# TLS / certs
# Provider pinned to `aws_lc_rs` (ANT-811): the old `ring` feature compiled
# the ring backend into rustls + rustls-webpki while rcgen/acmex already ran
# on aws-lc-rs — two crypto C builds (ring + aws-lc-sys) in one process.
# Default features (std/logging/tls12) are unchanged; the runtime provider
# install sites moved to `rustls::crypto::aws_lc_rs::default_provider()`.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
x509-cert = "0.3"
# Provider pinned to aws-lc-rs instead of the default `ring` (ANT-811):
# identical spec to the acmex fork's rcgen dep, so one rcgen unit with one
# provider is compiled. `crypto` + `pem` are rcgen's default feature set
# minus `ring`; rcgen's provider shim selects aws_lc_rs whenever it is
# present, so this also changes nothing at runtime.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
# Native ACME client (replaces the certbot sidecar container for Let's
# Encrypt issuance; see `src/acme.rs` and `src/le_certbot.rs`). Default crypto
# is aws-lc-rs (already in the tree via rcgen). DNS-01 providers are feature
# gated — Cloudflare is the default; the rest are available for users who
# manage DNS elsewhere (ANT-128). `zerossl-ca`/`google-ca` add those CAs.
acmex = { version = "0.8", features = [
  "dns-cloudflare", "dns-route53", "dns-digitalocean", "dns-linode",
  "dns-azure", "dns-google", "dns-alibaba", "dns-godaddy",
  "dns-tencent", "dns-huawei", "dns-cloudns",
  "zerossl-ca", "google-ca",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# `time` is a transitive dep of `rcgen`; used directly in tests to build
# custom certificate validity windows (rcgen's `OffsetDateTime`).
time = "0.3"
url = "2"
mime_guess = "2"
hex = "0.4"
thiserror = "2"
anyhow = "1"

# In-repo clippy baseline (ANT-791): makes lint behavior reproducible
# independent of the build image — the weekly clippy scan and any ad-hoc
# `cargo clippy` run pick this up from the workspace instead of relying on
# the image's toolchain defaults. `clippy::all` at `warn` is exactly what a
# plain `cargo clippy` run enforces by default, so the baseline changes
# nothing at the current state (the existing `if_same_then_else` pair in
# vreckan-admin stays a warning, not an error — CI cannot flip red).
# Tighten individual lints here (deny, or add categories) as follow-up work;
# `priority = -100` keeps explicit per-lint entries above the category entry.
[workspace.lints.clippy]
all = { level = "warn", priority = -100 }

[package]
name = "vreckan"
version = { workspace = true }
edition = { workspace = true }
description = "Vreckan server (Rust port of the Python/FastAPI server)"
# MPL-2.0 to match the upstream SealSkin fork this project derives from (see
# LICENSE). The Rust source is a net-new implementation; the served web client
# under `server/static/` carries over SealSkin-licensed files (see the
# per-file notes in the repo).
license = { workspace = true }

# Opt the root package into the workspace lint table (ANT-791).
[lints]
workspace = true

[[bin]]
name = "vreckan"
path = "src/main.rs"

[dependencies]
vreckan-core = { path = "crates/vreckan-core" }
vreckan-acme = { path = "crates/vreckan-acme" }
vreckan-auth = { path = "crates/vreckan-auth" }
vreckan-collab = { path = "crates/vreckan-collab" }
vreckan-sessions = { path = "crates/vreckan-sessions" }
vreckan-catalog = { path = "crates/vreckan-catalog" }
vreckan-files = { path = "crates/vreckan-files" }
vreckan-admin = { path = "crates/vreckan-admin" }
anyhow = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Carried over from the pre-split root manifest to keep the dependency tree
# unchanged; Phase 3 crypto unification (ANT-811) sorted out the dead crypto
# ones: the direct `ring` dep had no `ring::` references anywhere (only the
# rustls provider install sites, which use rustls's own re-exports), and the
# direct `openid` dep had no `openid::` references either — OIDC is
# hand-rolled on reqwest + jsonwebtoken (the JWKS fetch likewise, ANT-855),
# and none of them depend on the openid crate — so both, and with them the
# `openid → biscuit 0.7 → ring` chain, left the tree; the dead non-crypto
# `axum-reverse-proxy` and `axum-extra` direct deps (zero source references)
# left the manifest in
# ANT-852, dropping their transitive `cookie` 0.18 / `tokio-tungstenite` +
# `tungstenite` 0.28 copies with them; the test-only `http-body-util` dep
# (used only by the per-crate test harnesses) moved to
# `vreckan-test-support` in ANT-853 (ANT-849 #4).

# The integration test suite moved out of the root `tests/` into the
# per-crate `tests/` directories in ANT-810 (each test binary now links
# only the crates it exercises), so the root package carries no
# dev-dependencies of its own.

# The published `acmex` 0.8.0 hard-codes the ACME account key as Ed25519 and
# signs every JWS with `alg: EdDSA`, but Let's Encrypt production no longer
# accepts EdDSA (2026-10: RS256/ES256/ES384/ES512 only) — registration fails
# and the `Location`-header check masks the real 400 (ANT-138). Upstream
# derives the JWS `alg` and JWK from the actual key (`Jwk::for_key_pair`,
# `JwsSigner::jwa_algorithm`) and adds `KeyPairGenerator`, so we pin an
# `vreckan-project/acmex` fork (of houseme/acmex @ f7b06c2; relocated out of
# the maintainer's personal `antitux/acmex` repo, ANT-284) with seven fixes:
#   1. the `contact` field in account responses is defaulted — Boulder
#      omits it when the account has no contacts, which broke parsing;
#   2. POST-as-GET reads (order/authz/cert lookup, account lookup) use
#      an empty payload — Boulder rejects the `e30` (`{}`) encoding with
#      "must have an empty payload";
#   3. order polling is budgeted at 5 minutes per stage (60s was below
#      Let's Encrypt's dns-01 validation cadence — first attempts fail
#      during DNS propagation and retries come minutes later);
#   4. challenge *activation* must POST an empty object (`{` + `}`), not
#      an empty payload — an empty payload is a POST-as-GET (fetch only)
#      and never triggers validation (RFC 8555 7.5.1), so
#      challenges sat "pending" forever;
#   5. CSR subject CN: rcgen's default DN is CN="rcgen self signed
#      cert", which Boulder rejects ("Domain name contains an invalid
#      character"); the fork sets the CN to the first identifier;
#   6. the Cloudflare provider's TXT create is idempotent — Cloudflare
#      81058 ("An identical record already exists") fires when a CA
#      reuses a still-valid authorization (same token, same digest) and
#      a previous run left the record in place; the fork reuses the
#      existing record instead of failing the issuance;
#   7. the optional `aws-lc-rs` backend no longer forces the `fips` feature
#      (ANT-811) — it had compiled a second full C build of the aws-lc
#      source (`aws-lc-fips-sys`) on top of the default `aws-lc-sys` while
#      no runtime path exercised FIPS mode.
# We generate ECDSA P-256 account keys (ES256), accepted by all three
# supported CAs. Revert to the crates.io release once the fixes ship in a
# published version. The pin is the `vreckan-2026-11-03` tag on the
# company-owned fork (fixes 1–6 landed as `vreckan-2026-10-16`, ANT-275) — a
# force-push of the branch no longer changes what we build, and Cargo.lock
# additionally records the resolved commit sha, so a moved tag shows up as a
# lockfile diff until the next `cargo update`.
# The fork lives in the project org (vreckan-project/acmex, ANT-284),
# mirrored out of the maintainer's personal account (antitux/acmex).
[patch.crates-io]
acmex = { git = "https://github.com/vreckan-project/acmex", tag = "vreckan-2026-11-03" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# CI test profile: thin-LTO (vs fat) and 16 codegen units (vs 1) cut the
# ~24 test-binary compiles roughly in half while keeping cross-crate
# optimisation. The production binary still uses the release profile above.
[profile.test-release]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
