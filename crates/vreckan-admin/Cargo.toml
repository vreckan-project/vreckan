[package]
name = "vreckan-admin"
version = { workspace = true }
edition = { workspace = true }
description = "Vreckan server composition: admin API, security headers/CORS, router, TLS serve loop"
license = { workspace = true }

# Explicit target: the Docker build stage copies only the manifests before
# `cargo fetch`, where `src/lib.rs` does not exist yet — with autodiscovery
# alone the manifest would fail to parse ("no targets specified").
[lib]
path = "src/lib.rs"
[dependencies]
vreckan-core = { path = "../vreckan-core" }
vreckan-acme = { path = "../vreckan-acme" }
vreckan-auth = { path = "../vreckan-auth" }
# The central cluster (ANT-812): the admin API drives the app catalog, the
# session domains, and the collaboration room, and hosts the backup/restore
# routines (moved out of the old `vreckan-apps` crate, which they dissolved).
vreckan-collab = { path = "../vreckan-collab" }
vreckan-catalog = { path = "../vreckan-catalog" }
vreckan-files = { path = "../vreckan-files" }
vreckan-sessions = { path = "../vreckan-sessions" }

anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
base64 = { workspace = true }
# Backup/restore archives (the `backup_manager` module moved into this
# crate in ANT-812).
chrono = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

# The same-port dispatch tests in `serve.rs` build a no-verify TLS client.
[dev-dependencies]
rustls-pki-types = { workspace = true }

# Opt into the workspace lint table: the clippy baseline is defined once in
# the root Cargo.toml ([workspace.lints.clippy], ANT-791).
[lints]
workspace = true
