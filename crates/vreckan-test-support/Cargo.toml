[package]
name = "vreckan-test-support"
version = { workspace = true }
edition = { workspace = true }
description = "Shared integration-test harness for the vreckan domain crates (ANT-853)"
license = { workspace = true }

# Explicit target: the Docker build stage copies only the manifests before
# `cargo fetch`, where `src/lib.rs` does not exist yet — with autodiscovery
# alone the manifest would fail to parse ("no targets specified").
[lib]
path = "src/lib.rs"

# Dev-only crate: dev-dependency of the domain crates' integration test
# suites, never linked by production code. vreckan-core provides the
# Settings/DB/AppState/security/static_files plumbing; vreckan-acme +
# vreckan-auth provide the E2EE handshake and auth routes the shared
# `compose_router` composes (every test binary already links all three —
# core as a lib dep, acme + auth as lib or dev deps — so no new link
# closure is introduced). `http-body-util` moved here from the root
# package's [dependencies] in ANT-853 (it was used only by the per-crate
# test harnesses).
[dependencies]
vreckan-core = { path = "../vreckan-core" }
vreckan-acme = { path = "../vreckan-acme" }
vreckan-auth = { path = "../vreckan-auth" }

axum = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
pkcs8 = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }

# Opt into the workspace lint table: the clippy baseline is defined once in
# the root Cargo.toml ([workspace.lints.clippy], ANT-791).
[lints]
workspace = true
