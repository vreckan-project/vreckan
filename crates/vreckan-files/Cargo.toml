[package]
name = "vreckan-files"
version = { workspace = true }
edition = { workspace = true }
description = "Vreckan files domain: file uploads, storage, and public shares"
license = { workspace = true }

# Explicit target: the Docker build stage copies only the manifests before
# `cargo fetch`, where `src/lib.rs` does not exist yet — with autodiscovery
# alone the manifest would fail to parse ("no targets specified").
[lib]
path = "src/lib.rs"
[dependencies]
vreckan-core = { path = "../vreckan-core" }
vreckan-acme = { path = "../vreckan-acme" }
# `auth::verify_token` is the shared authentication gate called from the
# files route handlers (ANT-770: apps→auth is a DAG edge; moving
# `verify_token` into core would drag `user_manager` with it).
vreckan-auth = { path = "../vreckan-auth" }
# The files routes run uploads through the catalog's launch/upload
# machinery (ANT-812: files→catalog is a DAG edge).
vreckan-catalog = { path = "../vreckan-catalog" }
# Housekeeping routes purge expired session shares (ANT-812:
# files→sessions is a DAG edge; the shared password page the reverse edge
# used to need now lives in `core::static_files`).
vreckan-sessions = { path = "../vreckan-sessions" }

axum = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Opt into the workspace lint table: the clippy baseline is defined once in
# the root Cargo.toml ([workspace.lints.clippy], ANT-791).
[lints]
workspace = true
