[package]
name = "vreckan-collab"
version = { workspace = true }
edition = { workspace = true }
description = "Vreckan collaboration domain: the shared-room WebSocket service, token tables, viewer fan-out"
license = { workspace = true }

# Explicit target: the Docker build stage copies only the manifests before
# `cargo fetch`, where `src/lib.rs` does not exist yet — with autodiscovery
# alone the manifest would fail to parse ("no targets specified").
[lib]
path = "src/lib.rs"
[dependencies]
vreckan-core = { path = "../vreckan-core" }

axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Opt into the workspace lint table: the clippy baseline is defined once in
# the root Cargo.toml ([workspace.lints.clippy], ANT-791).
[lints]
workspace = true
