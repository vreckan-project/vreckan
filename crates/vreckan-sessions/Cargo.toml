[package]
name = "vreckan-sessions"
version = { workspace = true }
edition = { workspace = true }
description = "Vreckan session domains: session shares (join grants, public share links) and the selkies session proxy"
license = { workspace = true }

# Explicit target: the Docker build stage copies only the manifests before
# `cargo fetch`, where `src/lib.rs` does not exist yet — with autodiscovery
# alone the manifest would fail to parse ("no targets specified").
[lib]
path = "src/lib.rs"
[dependencies]
vreckan-core = { path = "../vreckan-core" }
vreckan-acme = { path = "../vreckan-acme" }
# `auth::verify_token` is the shared authentication gate called from the
# session-share route handlers (ANT-770: apps→auth is a DAG edge; moving
# `verify_token` into core would drag `user_manager` with it).
vreckan-auth = { path = "../vreckan-auth" }
# The session-share join flow pushes to / reads the collaboration room's
# token table (ANT-812: sessions→collab is a DAG edge).
vreckan-collab = { path = "../vreckan-collab" }

axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }

# Integration test suite (tests/): the former root-package suite was
# re-homed per crate in ANT-810 so each test binary links only the crates
# it exercises, and the dissolved `vreckan-apps` session-share and
# participant tests landed here in ANT-821 (including the real-Docker
# session-share e2e, which needs `bollard`). The shared harness lives in
# `vreckan-test-support` (ANT-853); the dev-deps below are the external
# crates the test files themselves reference, trimmed from the old root
# [dev-dependencies].
[dev-dependencies]
# The shared test harness (ANT-853): the per-crate `tests/common` shim
# re-exports it. It depends on core/acme/auth, which this crate already
# links, so no new link closure is introduced.
vreckan-test-support = { path = "../vreckan-test-support" }
aes-gcm = { workspace = true }
bollard = { workspace = true }
pkcs8 = { workspace = true }
rsa = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }
# The shared test harness composes the catalog routes the session flows
# depend on (join, my-sessions) and persists session state through
# `catalog::save_sessions`, so the test binaries link vreckan-catalog
# although the lib does not depend on it (a dev-dep cycle is fine; no
# production DAG edge is added).
vreckan-catalog = { path = "../vreckan-catalog" }

# Opt into the workspace lint table: the clippy baseline is defined once in
# the root Cargo.toml ([workspace.lints.clippy], ANT-791).
[lints]
workspace = true
