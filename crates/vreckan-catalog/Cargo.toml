[package]
name = "vreckan-catalog"
version = { workspace = true }
edition = { workspace = true }
description = "Vreckan app domain: the app catalog/store, image pulls, launches, and the Docker provider"
license = { workspace = true }

# Explicit target: the Docker build stage copies only the manifests before
# `cargo fetch`, where `src/lib.rs` does not exist yet — with autodiscovery
# alone the manifest would fail to parse ("no targets specified").
[lib]
path = "src/lib.rs"
[dependencies]
vreckan-core = { path = "../vreckan-core" }
vreckan-acme = { path = "../vreckan-acme" }
# `auth::verify_token` is the shared authentication gate called from the
# catalog route handlers (ANT-770: apps→auth is a DAG edge; moving
# `verify_token` into core would drag `user_manager` with it).
vreckan-auth = { path = "../vreckan-auth" }
# Session launches push to the collaboration room's token table and notify
# it when a session ends (ANT-812: catalog→collab is a DAG edge).
vreckan-collab = { path = "../vreckan-collab" }
# The launch/join access checks call the session-share grant helpers
# (ANT-812: catalog→sessions is a DAG edge).
vreckan-sessions = { path = "../vreckan-sessions" }

axum = { workspace = true }
base64 = { workspace = true }
bollard = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Ephemeral-volume path names in the launch path.
uuid = { workspace = true }

# Integration test suite (tests/): the former root-package suite was
# re-homed per crate in ANT-810 so each test binary links only the crates
# it exercises, and the dissolved `vreckan-apps` tests landed here in
# ANT-821 (launch, docker-launch, user-sessions, auto-update, the ANT-443/
# ANT-470 token-table tests, the Postgres DB tests). The dev-deps are the
# external crates the tests + the shared harness use, trimmed from the old
# root [dev-dependencies].
[dev-dependencies]
aes-gcm = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
# `atexit` hook for the throwaway postgres fixture teardown on normal exit
# (the `OnceLock` static never drops its contained value) — ANT-901. Already
# locked transitively (0.2.x), so no new crate is fetched.
libc = "0.2"
pkcs8 = { workspace = true }
rsa = { workspace = true }
tower = { workspace = true }

# Opt into the workspace lint table: the clippy baseline is defined once in
# the root Cargo.toml ([workspace.lints.clippy], ANT-791).
[lints]
workspace = true
