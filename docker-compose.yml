name: vreckan

services:
  # One-shot ownership fix for the ./vreckan-data bind mount (ANT-81, P1-1).
  # The server now runs as UID/GID 1000 (non-root), but Docker creates a
  # missing bind-mount directory as root:root, so a first boot on a fresh
  # host (or an upgrade from the old root-running v0.5.x image) would find a
  # /data it cannot write. This service chowns the tree to 1000:1000 once
  # per `docker compose up`; vreckan-http waits for it to complete. It is a
  # no-op (fast walk) on hosts where the tree is already owned by 1000.
  data-perms:
    image: alpine:3.21
    container_name: vreckan-data-perms
    restart: "no"
    command: sh -c "chown -R 1000:1000 /data"
    volumes:
      - ./vreckan-data:/data

  vreckan-http:
    # The Rust image built by the multi-stage Dockerfile. `build: .` is the
    # local fallback: `docker compose build` (or `up --build`) builds it from
    # this repo and tags it under the image name, so it runs locally without a
    # registry. A real deployment points `image:` at the registry-published
    # tag (see docs/ops.md) and drops `build:`.
    image: ghcr.io/vreckan-project/vreckan:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vreckan-http
    restart: unless-stopped
    working_dir: /app
    ports:
      - "443:443"
    # Defaults to the bundled Postgres service below. Override VRECKAN_DATABASE_URL
    # (or VRECKAN_DB_USER/PASS/NAME) in `.env` to point elsewhere or to use
    # SQLite. The `${VAR:-default}` form keeps `.env` as the override source
    # while postgres is the out-of-the-box default.
    environment:
      - VRECKAN_DATABASE_URL=${VRECKAN_DATABASE_URL:-postgres://${VRECKAN_DB_USER:-vreckan}:${VRECKAN_DB_PASS:-vreckan}@postgres:5432/${VRECKAN_DB_NAME:-vreckan}}
    depends_on:
      postgres:
        condition: service_healthy
      # The one-shot chown of ./vreckan-data must finish before the first
      # non-root boot writes to /data (ANT-81, P1-1).
      data-perms:
        condition: service_completed_successfully
    env_file:
      - .env
    # P1-1 (ANT-81): the server process runs non-root inside the image
    # (USER vreckan, UID/GID 1000), so `privileged: true` is no longer
    # required. The host-side work — creating app containers, GPU setup — is
    # done by the Docker daemon over the socket, not by this process, so no
    # capabilities are granted by default. If a specific app-container
    # feature turns out to need one, add it here as a targeted `cap_add`
    # entry (see docs/ops.md §6) instead of going back to privileged.
    ipc: host
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "990"
      - "44"
      # Non-root access to the host Docker socket: the socket is owned
      # root:docker mode 660, so the server process reaches the daemon
      # through the host's docker group. VRECKAN_DOCKER_GROUP takes the group
      # name or GID for hosts whose daemon group is not named `docker`
      # (rootless setups, custom installs); see docs/ops.md §6.
      - "${VRECKAN_DOCKER_GROUP:-docker}"
    volumes:
      - ./vreckan-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri

  postgres:
    image: postgres:16
    container_name: vreckan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VRECKAN_DB_USER:-vreckan}
      POSTGRES_PASSWORD: ${VRECKAN_DB_PASS:-vreckan}
      POSTGRES_DB: ${VRECKAN_DB_NAME:-vreckan}
    ports:
      - "5432:5432"
    volumes:
      - ./vreckan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VRECKAN_DB_USER:-vreckan} -d ${VRECKAN_DB_NAME:-vreckan}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
