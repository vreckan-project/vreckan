packages:
  - packages/*
  - packages/adapters/*
  - packages/plugins/*
  # Keep sandbox-provider plugins installable as standalone packages without
  # forcing root pnpm-lock.yaml churn for their third-party deps.
  - "!packages/plugins/sandbox-providers/**"
  - packages/plugins/examples/*
  # Keep this smoke fixture installable as a local plugin example without
  # forcing PRs to commit pnpm-lock.yaml for a new workspace importer.
  - "!packages/plugins/examples/plugin-orchestration-smoke-example"
  - server
  - ui
  - cli

# Keep in sync with package.json#pnpm.patchedDependencies. Newer pnpm
# versions read patch configuration only from the workspace manifest.
patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
  embedded-postgres@18.1.0-beta.16: patches/embedded-postgres@18.1.0-beta.16.patch
  acpx@0.12.0: patches/acpx@0.12.0.patch
  acpx@0.13.1: patches/acpx@0.13.1.patch
  "@agentclientprotocol/claude-agent-acp@0.73.0": patches/@agentclientprotocol__claude-agent-acp@0.73.0.patch
  "@agentclientprotocol/codex-acp@1.6.2": patches/@agentclientprotocol__codex-acp@1.6.2.patch
  "@chat-adapter/slack@4.39.0": patches/@chat-adapter__slack@4.39.0.patch
  "@chat-adapter/discord@4.39.0": patches/@chat-adapter__discord@4.39.0.patch
  "@chat-adapter/telegram@4.39.0": patches/@chat-adapter__telegram@4.39.0.patch
  "@chat-adapter/teams@4.39.0": patches/@chat-adapter__teams@4.39.0.patch
  "@chat-adapter/github@4.39.0": patches/@chat-adapter__github@4.39.0.patch
  "@discordjs/ws@1.2.3": patches/@discordjs__ws@1.2.3.patch

# Agent CLIs share the current runtime used by the native provider pack.
# pnpm patches change package files, but overrides control dependency resolution.
overrides:
  "@agentclientprotocol/codex-acp@1.6.2>@openai/codex": "0.160.0"
  "@agentclientprotocol/claude-agent-acp@0.73.0>@anthropic-ai/claude-agent-sdk": "0.3.286"
  rollup: ">=4.59.0"
  react: "^19.2.8"
  react-dom: "^19.2.8"
  # CodeMirror validates extensions with instanceof, so exactly one copy of
  # these two packages may resolve. Different CodeMirror packages pin
  # different transitive minors, which resolves two copies and crashes the
  # editor with "Unrecognized extension value in extension set". A shared
  # range forces every consumer onto one resolution.
  "@codemirror/state": "^6.7.2"
  "@codemirror/view": "^6.43.11"
  # Parsers and highlighters must share NodeProp IDs from one Lezer instance.
  # Mixed copies can interpret unrelated node metadata as highlighting tags.
  "@lezer/common": "^1.5.2"
  # Security bumps (ANT-1320): force vulnerable transitive pins onto patched
  # releases. Ranges below are pinned to the lowest patched version so a
  # future `pnpm update` can still move them forward.
  # connect-node (via @cursor/sdk) pins undici 5.x; 5.29.0 is the last 5.x and
  # still vulnerable (<6.24.0). 6.29.1 is the patched 6.x release and this
  # override is what drops the @fastify/busboy 2.x instance as well.
  "@connectrpc/connect-node>undici": "6.29.1"
  # GHSA-mrhx-c7xc-m3w5 affects zod <4.6.6 with no 3.x fix, and every zod
  # consumer in the tree accepts ^4 (peer or dep). 4.6.7 is the latest
  # patched release. One global override dedupes all instances, including
  # @vercel/cli-config's exact 4.1.11 pin, @cursor/sdk's ^3.25.0 declaration
  # (classic-API constructors only: string/object/enum/union/record/
  # preprocess/transform/superRefine/safeParse, all compatible with zod 4),
  # and the acpx / @agentclientprotocol ACP pins.
  "zod": "4.6.7"
  # svix 1.76.1 is exact-pinned in server and depends on uuid ^10.0.0; the
  # uuid advisory affects <11.1.1. 11.1.1 is the patched release (svix 1.97+
  # dropped uuid entirely, but the pin stays).
  "svix>uuid": "11.1.1"
  # @mdxeditor/editor pins js-yaml 4.3.1; the advisory affects <4.3.2.
  "@mdxeditor/editor>js-yaml": "4.3.2"
  # @tailwindcss/typography pulls postcss-selector-parser 6.0.x; the advisory
  # affects <6.1.5. 6.1.6 is the patched release.
  "@tailwindcss/typography>postcss-selector-parser": "6.1.6"
  # @microsoft/teams.apps resolves @azure/msal-node 4.x/5.x; the authorization
  # code flow disclosure advisory is patched in 7.1.0. 7.2.3 is API-compatible
  # with the token-manager usage (ConfidentialClientApplication,
  # ManagedIdentityApplication, clientAssertion callback, system.loggerOptions).
  "@azure/msal-node": "7.2.3"
  # @esbuild-kit/core-utils pins esbuild ~0.18.20; the advisory affects
  # <=0.24.2. 0.28.2 is the esbuild release already resolved at the root.
  "@esbuild-kit/core-utils>esbuild": "0.28.2"
  # Per-major undici pins: 6.29.1, 7.30.2 and 8.13.1 are the patched releases
  # for the <6.24.0 / 7.x / >=8.0.0 <8.10.2 advisory clusters.
  "@ai-sdk/provider-utils>undici": "7.30.2"
  "@discordjs/rest>undici": "6.29.1"
  "discord.js>undici": "6.29.1"
  "jsdom>undici": "8.13.1"
  # qs advisory cluster is patched in 6.16.1; 6.17.1 is the latest 6.x and
  # satisfies every parent's 6.x range.
  "qs": "6.17.1"
  # hono advisory cluster is patched in 4.13.16.
  "hono": "^4.13.16"
  # @hono/node-server advisory is patched in 2.1.6.
  "@modelcontextprotocol/sdk>@hono/node-server": "^2.1.6"
  # fast-copy advisory is patched in 4.1.0 (pino-pretty pins the 4.x line).
  "pino-pretty>fast-copy": "^4.1.0"
  # fast-uri advisory cluster (11 advisories) is patched in 3.1.9.
  "ajv>fast-uri": "^3.1.9"
  # follow-redirects advisory is patched in 1.16.1 (axios pulls it).
  "axios>follow-redirects": "^1.16.1"
  # ip-address advisory is patched in 10.7.4 (express-rate-limit pulls it).
  "express-rate-limit>ip-address": "^10.7.4"
  # source-map-js advisory is patched in 1.2.2 (postcss/css-tree/tailwind).
  "source-map-js": "^1.2.2"
  # katex advisory is patched in 0.18.2 (mermaid pins the 0.16 line).
  "mermaid>katex": "^0.18.2"
  # path-to-regexp advisory is patched in 8.4.0 (express's router pulls it).
  "router>path-to-regexp": "^8.4.0"
  # superagent (via the supertest devDep) resolves form-data 4.0.5; the CRLF
  # injection advisory is patched in 4.0.6.
  "superagent>form-data": "4.0.6"
  # The Storybook docgen plugin pins glob ^13; the Glob AbortSignal advisory
  # is patched in 14.0.2. 14.0.6 pulls minimatch ^11.0.5, whose
  # brace-expansion ^5.0.12 requirement clears the minimatch globparts DoS
  # and all three brace-expansion advisories in one move.
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": "14.0.6"
  # GHSA-6cpc-mj5c-m9rq ("Arbitrary File Write in cli") is ignored via
  # pnpm.auditConfig.ignoreGhsas in the root package.json: false positive —
  # the workspace folder "cli/" is flagged as the npm package "cli" <1.0.0,
  # but the workspace package is actually named "paperclipai".
