# Vreckan site container — nginx configuration.
# Serves the Jekyll build output (copied to /usr/share/nginx/html by the
# Dockerfile) as the default server on port 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site uses `permalink: pretty`, so every page resolves to a static
    # .html file; subpages are built as <page>/index.html directories.
    # Serve <page>/index.html directly for the extension-less URL so that
    # GET /docs/setup returns 200 without a 301 redirect to /docs/setup/.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Bounded caching for static assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
