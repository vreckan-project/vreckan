# Vreckan site container — nginx configuration.
# Serves the Jekyll build output (copied to /usr/share/nginx/html by the
# Dockerfile) as the default server on port 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site uses `permalink: pretty`, so every page builds to
    # <page>/index.html. Extension-less URLs resolve to the directory index
    # ($uri/index.html) — or a .html file ($uri.html) if a page ever carries
    # an explicit .html permalink — so GET /docs/setup returns 200 without
    # a redirect.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Friendly 404 (site/404.md builds to /404/index.html under pretty
    # permalinks; the extension-less form resolves via try_files above).
    error_page 404 /404;

    # Bounded caching for static assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
